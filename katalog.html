<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>ADMIN KATALOG - FIREBASE rental2026</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#0a1629}
.navbar{background:#1a1a1a;color:#fff;padding:12px 20px;display:flex;justify-content:space-between;align-items:center}
.navbar a{color:#ffc107;text-decoration:none;margin-left:15px;font-size:13px;font-weight:bold}
.container{max-width:1200px;margin:15px auto;padding:15px}
.form-box{background:#fff;padding:18px;border-radius:10px;margin-bottom:20px;box-shadow:0 2px 8px rgba(0,0,0,0.3);border:2px solid #d4af37}
.form-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
input,select{width:100%;padding:9px;border:1px solid #aaa;border-radius:5px;font-size:12px}
label{font-size:11px;font-weight:bold}
.btn{background:#ffc107;color:#000;padding:10px 18px;border:none;border-radius:5px;font-weight:bold;cursor:pointer;font-size:12px}
.btn-danger{background:#dc3545;color:#fff}.btn-sm{padding:5px 10px;font-size:11px;margin-right:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:15px}
.card{background:#fff;border-radius:10px;box-shadow:0 2px 5px rgba(0,0,0,0.2);overflow:hidden;border:1px solid #ddd}
.card img{width:100%;height:180px;object-fit:cover;display:block}
.card-body{padding:12px;font-size:12px;line-height:1.4}
.preview-img{width:120px;height:70px;object-fit:cover;margin-top:5px;border-radius:5px;border:1px solid #d4af37}
.harga{color:#d32f2f;font-weight:bold}
.badge-ada{background:#28a745;color:white;padding:2px 6px;border-radius:3px;font-size:10px;font-weight:bold}
.badge-keluar{background:#dc3545;color:white;padding:2px 6px;border-radius:3px;font-size:10px;font-weight:bold}
.btn-kompres{background:#ff6f00;color:white;border:none;padding:4px 8px;border-radius:4px;cursor:pointer;font-size:10px;font-weight:bold;margin-left:4px}
</style>
</head>
<body>

<div class="navbar"><b>⚙️ ADMIN KATALOG - FIREBASE rental2026</b><div><a href="transaksi.html">Transaksi</a><a href="custreg.html">Customer</a><a href="piutang.html">Piutang</a><a href="index.html">Lihat Website</a></div></div>

<div class="container">
<h2 style="color:#d4af37;margin-bottom:10px;font-size:15px">1. Form Tambah / Edit Mobil - Connect ke Transaksi Beb</h2>
<div class="form-box">
<input type="hidden" id="idEdit">
<div class="form-grid">
<input type="text" id="nama" placeholder="Nama Mobil: NMAX 2024 / Alphard 2012" required>
<input type="text" id="plat" placeholder="Plat Nomor: DK 1234 AB - WAJIB BEB buat transaksi" required>
<div><label>Upload Gambar (auto kompres Beb)</label><div style="display:flex;align-items:center"><input type="file" id="gambarFile" accept="image/*"><button type="button" class="btn-kompres" onclick="kompresGambar()">🗜️ Kompres</button><span id="infoUkuran" style="font-size:10px;font-weight:bold;margin-left:5px"></span></div><input type="hidden" id="gambar"><img id="preview" class="preview-img" style="display:none"></div>
<input type="number" id="tahun" placeholder="Tahun: 2024" required>
<select id="transmisi"><option value="Matic">Matic</option><option value="Manual">Manual</option></select>
<input type="number" id="kursi" placeholder="Kursi: 2 (motor) / 6 (mobil)">
<select id="status"><option value="Ada">Ada (Ready)</option><option value="Keluar">Keluar (Disewa)</option></select>
<input type="number" id="hargaLepas" placeholder="Harga Lepas Kunci/hari - Dipakai di Transaksi Beb" required>
<input type="number" id="hargaDriver" placeholder="Harga + Driver/hari">
<input type="text" id="fitur" placeholder="Fitur: AC, Helm 2, Bagasi">
</div>
<br><label><input type="checkbox" id="promo"> Tampilkan di Slider Beranda</label><br><br>
<button class="btn" id="btnSimpan" onclick="simpanMobil()">Simpan ke Firebase Beb</button>
<button class="btn" style="background:#6c757d;color:white;margin-left:8px" onclick="resetForm()">Batal</button>
<span id="statusSimpan" style="margin-left:10px;font-size:12px;font-weight:bold"></span>
</div>

<h2 style="color:#d4af37;margin:15px 0 10px 0;font-size:15px">2. Data Mobil di Katalog - <span id="infoTotal">Loading...</span></h2>
<div class="grid" id="listMobil"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, doc, deleteDoc, updateDoc, getDoc } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

const firebaseConfig = { apiKey: "AIzaSyAYDuYpHiGqKLagE__fp-h00pUIAZGv7Vs", authDomain: "rental2026.firebaseapp.com", projectId: "rental2026", storageBucket: "rental2026.firebasestorage.app", messagingSenderId: "460493800655", appId: "1:460493800655:web:cac5f561fc219e764a23ba" };
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let dataMobil=[], fileAsli=null, gambarBase64='';

// LOAD REALTIME BEB
onSnapshot(collection(db,"mobil"), snap=>{
 dataMobil=[]; snap.forEach(d=>dataMobil.push({id:d.id,...d.data()}));
 document.getElementById('infoTotal').innerText=dataMobil.length+' Unit';
 tampilkanMobil();
});

document.getElementById('gambarFile').addEventListener('change', e=>{
 fileAsli=e.target.files[0]; if(!fileAsli) return;
 document.getElementById('infoUkuran').innerText=(fileAsli.size/1024).toFixed(0)+'KB';
 let r=new FileReader(); r.onload=ev=>{
  gambarBase64=ev.target.result; document.getElementById('gambar').value=gambarBase64;
  let p=document.getElementById('preview'); p.src=gambarBase64; p.style.display='block';
  if(fileAsli.size>900000) kompresGambar();
 }; r.readAsDataURL(fileAsli);
});

window.kompresGambar=()=>{
 if(!gambarBase64) return; let img=new Image(); img.src=gambarBase64;
 img.onload=()=>{
  let c=document.createElement('canvas'); let maxW=900; let s=Math.min(maxW/img.width,maxW/img.height,1);
  c.width=img.width*s; c.height=img.height*s; c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  c.toBlob(b=>{ let r=new FileReader(); r.onload=ev=>{ gambarBase64=ev.target.result; document.getElementById('gambar').value=gambarBase64; document.getElementById('preview').src=gambarBase64; document.getElementById('infoUkuran').innerText=(b.size/1024).toFixed(0)+'KB ✅'; }; r.readAsDataURL(b); },'image/jpeg',0.65);
 }
}

window.simpanMobil=async()=>{
 if(!nama.value||!plat.value||!gambar.value||!hargaLepas.value){ alert('Nama, Plat, Gambar, Harga Wajib Isi Beb!'); return; }
 if(gambar.value.length>1100000){ alert('Gambar kegedean Beb! Klik 🗜️ Kompres dulu Beb!'); return; }
 let btn=document.getElementById('btnSimpan'); btn.disabled=true; btn.innerText='Menyimpan...';
 let id=document.getElementById('idEdit').value;
 let mobil={
  // field untuk katalog lama Beb
  nama:nama.value, gambar:gambar.value, tahun:tahun.value, transmisi:transmisi.value, kursi:kursi.value, status:status.value,
  hargaLepas:parseInt(hargaLepas.value), hargaDriver:parseInt(hargaDriver.value)||0, fitur:fitur.value, promo:promo.checked,
  // field untuk transaksi Beb biar connect Beb
  nama_mobil:nama.value, merk:nama.value, plat:plat.value.toUpperCase(), nopol:plat.value.toUpperCase(),
  harga:parseInt(hargaLepas.value), harga_sewa:parseInt(hargaLepas.value),
  status_mobil:status.value, status_katalog:status.value,
  updated_at:new Date().toISOString(), created_at:new Date().toISOString()
 };
 try{
  if(id){ await updateDoc(doc(db,"mobil",id), mobil); document.getElementById('statusSimpan').innerText='✅ Updated Beb!'; }
  else { mobil.created_at=new Date().toISOString(); await addDoc(collection(db,"mobil"), mobil); document.getElementById('statusSimpan').innerText='✅ Tersimpan Beb!'; }
  resetForm();
 }catch(err){ alert('Error Beb: '+err.message); }
 btn.disabled=false; btn.innerText='Simpan ke Firebase Beb';
 setTimeout(()=>document.getElementById('statusSimpan').innerText='',3000);
}

function tampilkanMobil(){
 let list=document.getElementById('listMobil'); list.innerHTML='';
 if(dataMobil.length==0){ list.innerHTML='<div style="color:#d4af37">Belum ada mobil Beb, tambah di atas Beb!</div>'; return; }
 dataMobil.forEach(m=>{
  let statusBadge=(m.status_mobil||m.status||'Ada')=='Ada'?'<span class="badge-ada">ADA</span>':'<span class="badge-keluar">KELUAR</span>';
  list.innerHTML+=`
  <div class="card">
   <img src="${m.gambar}" alt="${m.nama||m.nama_mobil}">
   <div class="card-body">
    <h3>${m.nama||m.nama_mobil} ${statusBadge}</h3>
    <p>🅿️ ${m.plat||m.nopol||'-'} | 🚗 ${m.transmisi||'-'} | 👥 ${m.kursi||'-'} Kursi | ${m.tahun||''}</p>
    <p class="harga">Lepas: Rp ${(m.hargaLepas||m.harga||0).toLocaleString()}/hari</p>
    <p class="harga">Driver: Rp ${(m.hargaDriver||0).toLocaleString()}/hari</p>
    <p>Fitur: ${m.fitur||'-'}</p>
    <p>Slider: ${m.promo?'✅ Ya':'❌ Tidak'}</p>
    <div style="margin-top:8px"><button class="btn btn-sm" onclick="editMobil('${m.id}')">Edit</button><button class="btn btn-sm btn-danger" onclick="hapusMobil('${m.id}')">Hapus</button></div>
   </div>
  </div>`;
 });
}

window.editMobil=async id=>{
 let snap=await getDoc(doc(db,"mobil",id)); if(!snap.exists()) return; let m=snap.data();
 document.getElementById('idEdit').value=id; document.getElementById('nama').value=m.nama||m.nama_mobil||''; document.getElementById('plat').value=m.plat||m.nopol||'';
 document.getElementById('tahun').value=m.tahun||''; document.getElementById('transmisi').value=m.transmisi||'Matic'; document.getElementById('kursi').value=m.kursi||'';
 document.getElementById('status').value=m.status_mobil||m.status||'Ada'; document.getElementById('hargaLepas').value=m.hargaLepas||m.harga||''; document.getElementById('hargaDriver').value=m.hargaDriver||'';
 document.getElementById('fitur').value=m.fitur||''; document.getElementById('promo').checked=m.promo||false; document.getElementById('gambar').value=m.gambar||''; gambarBase64=m.gambar||'';
 document.getElementById('preview').src=m.gambar||''; document.getElementById('preview').style.display=m.gambar?'block':'none';
 window.scrollTo(0,0);
}

window.hapusMobil=async id=>{ if(!confirm('Hapus mobil ini Beb? Nanti hilang juga dari transaksi Beb!')) return; await deleteDoc(doc(db,"mobil",id)); }

window.resetForm=()=>{
 document.getElementById('idEdit').value=''; document.querySelectorAll('#nama,#plat,#tahun,#kursi,#hargaLepas,#hargaDriver,#fitur').forEach(i=>i.value='');
 document.getElementById('gambar').value=''; gambarBase64=''; document.getElementById('preview').style.display='none'; document.getElementById('gambarFile').value=''; document.getElementById('promo').checked=false; document.getElementById('infoUkuran').innerText='';
}
</script>
</body>
</html>
