<!DOCTYPE html>
<html>
<head>
<title>MASTER DATA CUSTOMER - rental2026 FINAL</title>
<style>
body { font-family: 'Segoe UI', Arial; background: linear-gradient(135deg, #0a1629 0%, #12233a 100%); margin: 0; padding: 15px; color: #333; height: 100vh; overflow: hidden; }
h2 { text-align: center; color: #d4af37; font-size: 18px; margin: 5px 0 15px 0; }
.container { display: flex; gap: 15px; height: calc(100vh - 60px); }
.box { background: rgb(223, 236, 186); border: 2px solid #d4af37; border-radius: 8px; padding: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
.box-kiri { width: 40%; overflow-y:auto; }.box-kanan { width: 60%; overflow-y: auto; }
.form-grid { display: grid; grid-template-columns: 120px 1fr; gap: 10px 12px; align-items: center; font-size: 13px; }
.form-grid label { font-weight: 500; text-align: right; }
.form-grid input,.form-grid select,.form-grid textarea { padding: 6px 8px; border: 1px solid #aaa; border-radius: 4px; width: 100%; box-sizing: border-box; }
.form-grid textarea { height: 60px; resize: vertical; }
.form-grid.full { grid-column: 1 / 3; }
.btn-simpan { background: #007bff; color: white; border: none; padding: 8px 25px; border-radius: 4px; cursor: pointer; font-size: 14px; font-weight: bold; margin-top: 10px; width:100%; }
.btn-update { background: #28a745; }.btn-batal { background: #6c757d; margin-top:5px; }
.btn-kompres{background:#ff6f00;color:white;border:none;padding:5px 10px;border-radius:4px;cursor:pointer;font-size:11px;font-weight:bold;margin-left:5px}
table { width: 100%; border-collapse: collapse; font-size: 12px; }
th { background: #d4af37; color: #000; padding: 8px; border: 1px solid #aaa; position: sticky; top: 0; }
td { padding: 6px; border: 1px solid #ddd; text-align: center; }
.btn-aksi { color: white; border: none; padding: 4px 8px; font-size: 11px; border-radius: 3px; cursor: pointer; margin: 0 2px; }
.btn-edit { background: #ffc107; color: #000; }.btn-hapus { background: #dc3545; }.btn-detail { background: #17a2b8; }
.modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); }
.modal-content { background: white; margin: 5% auto; padding: 20px; border-radius: 8px; width: 50%; max-width: 500px; text-align: center; }
.modal-content img { width: 120px; height: 120px; object-fit: cover; border-radius: 50%; border: 3px solid #d4af37; margin-bottom: 10px; }
.modal-grid { display: grid; grid-template-columns: 120px 1fr; gap: 8px; font-size: 13px; text-align: left; }
.close { float: right; font-size: 28px; font-weight: bold; cursor: pointer; }
.foto-thumb { width: 35px; height: 35px; object-fit: cover; border-radius: 50%; cursor: zoom-in; border: 2px solid #d4af37; }
.foto-thumb:hover { transform: scale(1.2); transition: 0.2s; }
#modalZoom { display: none; position: fixed; z-index: 999; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); }
#modalZoom img { margin: auto; display: block; max-width: 85%; max-height: 85%; margin-top: 4%; border: 3px solid #d4af37; border-radius: 8px; }
.close-zoom { position: absolute; top: 20px; right: 35px; color: #fff; font-size: 40px; font-weight: bold; cursor: pointer; }
.foto-wrap{display:flex;align-items:center;gap:5px}
#previewFoto{width:100%;max-height:100px;object-fit:contain;display:none;margin-top:5px;border:2px solid #d4af37;border-radius:6px}
</style>
</head>
<body>
<h2>MASTER DATA CUSTOMER - rental2026 [FIREBASE + KOMPRES]</h2>
<div class="container">
    <div class="box box-kiri">
        <form id="formCustomer" class="form-grid">
            <input type="hidden" id="edit_id">
            <label>No. KTP :</label><input type="text" id="no_ktp" required placeholder="5201... [ENTER]">
            <label>Nama Customer :</label><input type="text" id="nama_customer" required>
            <label>No. HP / WA :</label><input type="text" id="no_hp">
            <label>Email :</label><input type="text" id="email">
            <label>Alamat :</label><textarea id="alamat"></textarea>
            <label>Pekerjaan :</label><input type="text" id="pekerjaan">
            <label>Jenis Kelamin :</label><select id="jk"><option value="">- Pilih -</option><option value="Laki-laki">Laki-laki</option><option value="Perempuan">Perempuan</option></select>
            <label>Limit Kredit :</label><input type="number" id="limit_kredit" placeholder="0">

            <label>Foto Customer :</label>
            <div class="foto-wrap">
                <input type="file" id="foto" accept="image/*" style="width:130px;border:none">
                <button type="button" class="btn-kompres" onclick="kompresFoto()">🗜️ Kompres</button>
                <span id="infoUkuran" style="font-size:10px;font-weight:bold"></span>
            </div>
            <div style="grid-column:1/3"><img id="previewFoto"><small style="display:block;text-align:center;color:#666">Klik Kompres kalau foto kegedean Beb - Double klik foto di tabel untuk zoom Beb!</small></div>

            <label>Status :</label><select id="status_customer"><option value="Aktif">Aktif</option><option value="Blacklist">Blacklist</option></select>
            <label></label><span></span>
            <div class="full"><button type="submit" id="btnSimpan" class="btn-simpan">Simpan ke Firebase</button><button type="button" id="btnBatal" class="btn-simpan btn-batal" onclick="batalEdit()" style="display:none;">Batal</button></div>
        </form>
        <div id="status_info" style="text-align:center;margin-top:8px;font-weight:bold;font-size:11px;color:green">ENTER pindah Beb!</div>
    </div>
    <div class="box box-kanan">
        <input type="text" id="cari" placeholder="🔍 Cari Nama / KTP / HP Beb..." style="width:100%;padding:7px;border-radius:5px;border:1px solid #aaa;margin-bottom:8px;box-sizing:border-box">
        <table id="tabelCustomer"><thead><tr><th>Foto</th><th>No KTP</th><th>Nama</th><th>No HP</th><th>Limit Kredit</th><th>Status</th><th>Aksi</th></tr></thead><tbody><tr><td colspan=7>Loading Firebase...</td></tr></tbody></table>
    </div>
</div>

<div id="modalDetail" class="modal"><div class="modal-content"><span class="close">&times;</span><h3>DETAIL DATA CUSTOMER</h3><img id="detail_foto"><div class="modal-grid" id="detail_body"></div></div></div>
<div id="modalZoom"><span class="close-zoom" onclick="document.getElementById('modalZoom').style.display='none'">&times;</span><img id="imgZoom"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, doc, deleteDoc, updateDoc, getDoc } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

const firebaseConfig = { apiKey: "AIzaSyAYDuYpHiGqKLagE__fp-h00pUIAZGv7Vs", authDomain: "rental2026.firebaseapp.com", projectId: "rental2026", storageBucket: "rental2026.firebasestorage.app", messagingSenderId: "460493800655", appId: "1:460493800655:web:cac5f561fc219e764a23ba" };
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const colRef = collection(db, "customers");

let modeEdit=false; let fotoBase64=""; let fotoLama=""; let fileAsli=null; let allData=[];

document.getElementById('foto').addEventListener('change',e=>{
 fileAsli=e.target.files[0]; if(!fileAsli) return;
 document.getElementById('infoUkuran').innerHTML=(fileAsli.size/1024).toFixed(0)+' KB '+(fileAsli.size>800000?'❌':'✅');
 let r=new FileReader(); r.onload=ev=>{ fotoBase64=ev.target.result; let p=document.getElementById('previewFoto'); p.src=fotoBase64; p.style.display='block'; }; r.readAsDataURL(fileAsli);
});

window.kompresFoto=()=>{
 if(!fotoBase64 &&!fileAsli){ alert('Pilih foto dulu Beb!'); return; }
 let img=new Image(); img.src=fotoBase64||URL.createObjectURL(fileAsli);
 img.onload=()=>{
  let canvas=document.createElement('canvas'); let maxW=800; let scale=Math.min(maxW/img.width, maxW/img.height,1);
  canvas.width=img.width*scale; canvas.height=img.height*scale;
  canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
  let q=0.7; (function coba(q){ canvas.toBlob(b=>{ if(b.size>800000&&q>0.1) coba(q-0.1); else{ let r=new FileReader(); r.onload=ev=>{ fotoBase64=ev.target.result; document.getElementById('previewFoto').src=fotoBase64; document.getElementById('infoUkuran').innerHTML='✅ Jadi '+(b.size/1024).toFixed(0)+' KB Beb!'; }; r.readAsDataURL(b); }},'image/jpeg',q); })(q);
 }
}

document.getElementById('formCustomer').addEventListener('keydown',e=>{
 if(e.key==='Enter' && e.target.tagName!=='BUTTON' && e.target.tagName!=='TEXTAREA'){ e.preventDefault(); const els=Array.from(document.querySelectorAll('#formCustomer input, #formCustomer select, #formCustomer textarea, #formCustomer button[type=submit]')); const i=els.indexOf(e.target); if(i>-1&&i+1<els.length) els[i+1].focus(); }
});

document.getElementById('formCustomer').addEventListener('submit',async e=>{
 e.preventDefault();
 if(fotoBase64.length>1100000){ alert('Foto masih kegedean Beb! Klik 🗜️ Kompres dulu Beb!'); return; }
 let btn=document.getElementById('btnSimpan'); btn.disabled=true; btn.innerText='Menyimpan...';
 let data={ no_ktp:document.getElementById('no_ktp').value, nama_customer:document.getElementById('nama_customer').value, no_hp:document.getElementById('no_hp').value, email:document.getElementById('email').value, alamat:document.getElementById('alamat').value, pekerjaan:document.getElementById('pekerjaan').value, jk:document.getElementById('jk').value, limit_kredit:document.getElementById('limit_kredit').value, status_customer:document.getElementById('status_customer').value, foto:fotoBase64||fotoLama||"", foto_customer:fotoBase64||fotoLama||"", created_at:new Date().toISOString() };
 try{
  if(modeEdit){ await updateDoc(doc(db,"customers",document.getElementById('edit_id').value),data); batalEdit(); }
  else{ await addDoc(colRef,data); e.target.reset(); document.getElementById('previewFoto').style.display='none'; fotoBase64=""; fileAsli=null; document.getElementById('infoUkuran').innerText=''; }
  document.getElementById('status_info').innerText='✅ Tersimpan di Firebase Beb!';
 }catch(err){ alert(err.message); }
 btn.disabled=false; btn.innerText=modeEdit?'Update Data':'Simpan ke Firebase';
});

onSnapshot(colRef,snap=>{ allData=[]; snap.forEach(d=>allData.push({id:d.id,...d.data()})); render(allData); });
function render(data){
 let tbody=document.querySelector('#tabelCustomer tbody'); tbody.innerHTML='';
 if(!data.length){ tbody.innerHTML='<tr><td colspan=7>Belum ada Beb</td></tr>'; return; }
 data.forEach(c=>{
  let limit=c.limit_kredit?'Rp '+parseInt(c.limit_kredit).toLocaleString('id-ID'):'-';
  let fotoSrc=c.foto||c.foto_customer||'';
  let foto=fotoSrc?`<img src="${fotoSrc}" class="foto-thumb" ondblclick="zoomFoto('${fotoSrc}')" title="Double klik untuk zoom Beb">`:'-';
  tbody.innerHTML+=`<tr><td>${foto}</td><td>${c.no_ktp||''}</td><td>${c.nama_customer||''}</td><td>${c.no_hp||''}</td><td>${limit}</td><td><b style="color:${c.status_customer=='Aktif'?'green':'red'}">${c.status_customer||''}</b></td><td><button class="btn-aksi btn-detail" onclick="detailData('${c.id}')">Detail</button><button class="btn-aksi btn-edit" onclick="editData('${c.id}')">Edit</button><button class="btn-aksi btn-hapus" onclick="hapus('${c.id}')">Hapus</button></td></tr>`;
 });
}
document.getElementById('cari').addEventListener('input',e=>{ let k=e.target.value.toLowerCase(); let f=allData.filter(x=>(x.no_ktp||'').toLowerCase().includes(k)||(x.nama_customer||'').toLowerCase().includes(k)||(x.no_hp||'').toLowerCase().includes(k)); render(f); });

window.editData=async id=>{ let s=await getDoc(doc(db,"customers",id)); let c=s.data(); document.getElementById('edit_id').value=id; document.getElementById('no_ktp').value=c.no_ktp||''; document.getElementById('nama_customer').value=c.nama_customer||''; document.getElementById('no_hp').value=c.no_hp||''; document.getElementById('email').value=c.email||''; document.getElementById('alamat').value=c.alamat||''; document.getElementById('pekerjaan').value=c.pekerjaan||''; document.getElementById('jk').value=c.jk||''; document.getElementById('limit_kredit').value=c.limit_kredit||''; document.getElementById('status_customer').value=c.status_customer||'Aktif'; fotoLama=c.foto||c.foto_customer||''; fotoBase64=fotoLama; if(fotoLama){ let p=document.getElementById('previewFoto'); p.src=fotoLama; p.style.display='block'; } modeEdit=true; document.getElementById('btnSimpan').innerText='Update Data'; document.getElementById('btnSimpan').classList.add('btn-update'); document.getElementById('btnBatal').style.display='block'; }
window.batalEdit=()=>{ modeEdit=false; document.getElementById('formCustomer').reset(); document.getElementById('edit_id').value=""; fotoBase64=""; fotoLama=""; fileAsli=null; document.getElementById('previewFoto').style.display='none'; document.getElementById('infoUkuran').innerText=''; document.getElementById('btnSimpan').innerText='Simpan ke Firebase'; document.getElementById('btnSimpan').classList.remove('btn-update'); document.getElementById('btnBatal').style.display='none'; }
window.detailData=async id=>{ let s=await getDoc(doc(db,"customers",id)); let c=s.data(); document.getElementById('detail_foto').src=c.foto||c.foto_customer||''; let body=''; for(let k in c){ if(!['foto','foto_customer','id','created_at'].includes(k)){ let lab=k.replace('_',' ').toUpperCase(); let val=c[k]; if(k=='limit_kredit'&&val) val='Rp '+parseInt(val).toLocaleString('id-ID'); body+=`<b>${lab}:</b><span>${val||'-'}</span>`; } } document.getElementById('detail_body').innerHTML=body; document.getElementById('modalDetail').style.display='block'; }
window.hapus=async id=>{ if(confirm('Yakin hapus Beb?')) await deleteDoc(doc(db,"customers",id)); }
window.zoomFoto=src=>{ document.getElementById('imgZoom').src=src; document.getElementById('modalZoom').style.display='block'; }
document.querySelector('.close').onclick=()=>document.getElementById('modalDetail').style.display='none';
window.onclick=e=>{ if(e.target==document.getElementById('modalDetail')) document.getElementById('modalDetail').style.display='none'; if(e.target==document.getElementById('modalZoom')) document.getElementById('modalZoom').style.display='none'; }
</script>
</body>
</html>
