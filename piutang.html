<!DOCTYPE html>
<html>
<head>
<title>DATA PIUTANG - FIREBASE rental2026</title>
<style>
body{font-family:'Segoe UI',Arial;background:#0a1629;margin:0;padding:15px;color:#333}
h2{text-align:center;color:#d4af37;font-size:18px;margin:5px 0 10px 0;font-weight:bold}
.box{background:white;border:2px solid #d4af37;border-radius:8px;padding:15px;max-width:1300px;margin:auto}
.tabel-piutang{width:100%;border-collapse:collapse;font-size:11px}
.tabel-piutang th{background:#dc3545;color:#fff;padding:8px;text-align:center;position:sticky;top:0}
.tabel-piutang td{border:1px solid #ddd;padding:6px;text-align:center}
.tabel-piutang tr:nth-child(even){background:#fff5f5}
.badge-kredit{background:#ffc107;color:black;padding:3px 8px;border-radius:3px;font-size:10px;font-weight:bold}
.badge-belum{background:#dc3545;color:white;padding:3px 8px;border-radius:3px;font-size:10px;font-weight:bold}
.btn-bayar{background:#28a745;color:#fff;border:none;padding:5px 10px;border-radius:3px;cursor:pointer;font-size:11px;font-weight:bold}
.btn-bayar:hover{background:#218838}
.btn-back{background:#6c757d;color:#fff;border:none;padding:8px 16px;border-radius:4px;cursor:pointer;font-weight:bold;margin-bottom:10px;font-size:11px}
.total-box{background:#dc3545;color:#fff;padding:12px;border-radius:6px;text-align:center;font-size:16px;font-weight:bold;margin-bottom:12px;box-shadow:0 3px 10px rgba(0,0,0,0.3)}
.modal{display:none;position:fixed;z-index:100;left:0;top:0;width:100%;height:100%;background:rgba(0,0,0,0.7)}
.modal-content{background:#fff;margin:5% auto;padding:20px;border-radius:8px;width:42%;max-width:500px;border:2px solid #d4af37;position:relative}
.close{position:absolute;right:12px;top:8px;font-size:22px;font-weight:bold;cursor:pointer}
.form-bayar{display:grid;grid-template-columns:110px 1fr;gap:10px;align-items:center;font-size:12px;margin-top:15px}
.form-bayar input{padding:7px 8px;border:1px solid #aaa;border-radius:4px;width:100%;box-sizing:border-box}
.btn-simpan-bayar{background:#28a745;color:white;border:none;padding:10px;border-radius:4px;cursor:pointer;font-weight:bold;grid-column:2/3}
.btn-kompres{background:#ff6f00;color:white;border:none;padding:3px 7px;border-radius:3px;cursor:pointer;font-size:10px;font-weight:bold;margin-left:4px}
.preview-bukti{width:50px;height:50px;object-fit:cover;border-radius:4px;border:1px solid #aaa;margin-left:6px}
</style>
</head>
<body>

<h2>DATA PIUTANG CUSTOMER - FIREBASE</h2>
<div class="box">
<button class="btn-back" onclick="window.location='transaksi.html'">← Kembali ke Transaksi</button>
<button class="btn-back" style="background:#d4af37;color:#000;margin-left:6px" onclick="window.print()">🖨️ Cetak</button>
<span id="infoTotal" style="float:right;font-weight:bold;margin-top:8px;font-size:12px"></span>
<div class="total-box">TOTAL PIUTANG: Rp <span id="total_piutang">Loading...</span></div>
<div style="overflow-x:auto;max-height:70vh">
<table class="tabel-piutang">
<thead><tr><th>No</th><th>No Invoice</th><th>Customer</th><th>Mobil</th><th>Tgl Sewa</th><th>Total</th><th>Deposit</th><th>Sisa Piutang</th><th>Status</th><th>Aksi</th><th>Riwayat</th></tr></thead>
<tbody id="tbodyPiutang"><tr><td colspan="11">Loading Firebase Beb...</td></tr></tbody>
</table>
</div>
</div>

<!-- MODAL BAYAR -->
<div id="modalBayar" class="modal">
<div class="modal-content">
<span class="close" onclick="closeModal()">&times;</span>
<h3 style="margin:0 0 10px 0">BAYAR PIUTANG - FIREBASE</h3>
<form id="formBayar" class="form-bayar">
<label>No Invoice :</label><input type="text" id="bayar_invoice" readonly>
<label>Nama :</label><input type="text" id="bayar_nama" readonly>
<label>Sisa Piutang :</label><input type="text" id="bayar_sisa" readonly>
<label>Bayar :</label><input type="number" id="bayar_nominal" placeholder="0" required>
<label>Bukti :</label><div style="display:flex;align-items:center"><input type="file" id="bayar_bukti" accept="image/*" style="width:140px"><button type="button" class="btn-kompres" onclick="kompresBukti()">🗜️</button><img id="preview_bayar" class="preview-bukti" style="display:none"><span id="infoUkuran" style="font-size:10px;font-weight:bold;margin-left:4px"></span></div>
<div style="grid-column:2/3"><button type="submit" class="btn-simpan-bayar" id="btnSimpanBayar">SIMPAN PEMBAYARAN</button></div>
</form>
<div id="riwayatBox" style="margin-top:12px;font-size:11px;border-top:1px dashed #aaa;padding-top:8px"></div>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getFirestore, collection, onSnapshot, doc, updateDoc, getDoc } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

const firebaseConfig = { apiKey: "AIzaSyAYDuYpHiGqKLagE__fp-h00pUIAZGv7Vs", authDomain: "rental2026.firebaseapp.com", projectId: "rental2026", storageBucket: "rental2026.firebasestorage.app", messagingSenderId: "460493800655", appId: "1:460493800655:web:cac5f561fc219e764a23ba" };
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let dataCustomer=[], dataCustomerReguler=[], dataMobil=[], dataTransaksi=[], idBayar=null, buktiBase64='', fileAsli=null;

onSnapshot(collection(db,"customers"), s=>{ dataCustomer=[]; s.forEach(d=>dataCustomer.push({id:d.id,...d.data()})); loadPiutang(); });
onSnapshot(collection(db,"customers_reguler"), s=>{ dataCustomerReguler=[]; s.forEach(d=>dataCustomerReguler.push({id:d.id,...d.data()})); loadPiutang(); });
onSnapshot(collection(db,"mobil"), s=>{ dataMobil=[]; s.forEach(d=>dataMobil.push({id:d.id,...d.data()})); loadPiutang(); });
onSnapshot(collection(db,"transaksi"), s=>{ dataTransaksi=[]; s.forEach(d=>dataTransaksi.push({id:d.id,...d.data()})); loadPiutang(); });

function loadPiutang(){
 let tbody=document.getElementById('tbodyPiutang');
 let piutangData=dataTransaksi.filter(t=> (t.status_bayar=='Belum Lunas' || (parseInt(t.sisa_piutang||0)>0)) && t.tipe_customer=='kredit');
 if(piutangData.length==0){ tbody.innerHTML='<tr><td colspan="11">✅ Tidak ada piutang Beb! Semua lunas Beb!</td></tr>'; document.getElementById('total_piutang').innerText='Rp 0'; document.getElementById('infoTotal').innerText='0 Piutang'; return; }
 tbody.innerHTML=''; let total=0;
 piutangData.sort((a,b)=> (a.tgl_sewa||'').localeCompare(b.tgl_sewa||'')).forEach((t,i)=>{
  let cus=dataCustomer.find(c=>c.id==t.id_customer)||dataCustomerReguler.find(c=>c.id==t.id_customer);
  let mob=dataMobil.find(m=>m.id==t.id_mobil);
  let sisa=parseInt(t.sisa_piutang)||(parseInt(t.total_bayar||0)-parseInt(t.deposit||0)); if(sisa<0) sisa=0; total+=sisa;
  let riwayat=(t.riwayat_bayar||[]).length?`${t.riwayat_bayar.length}x bayar`:'-';
  tbody.innerHTML+=`<tr><td>${i+1}</td><td>${t.no_invoice||''}</td><td style="text-align:left">${cus?.nama_customer||'-'}</td><td>${mob?.plat||mob?.nopol||'-'}</td><td>${t.tgl_sewa||''}</td><td>Rp ${parseInt(t.total_bayar||0).toLocaleString('id-ID')}</td><td>Rp ${parseInt(t.deposit||0).toLocaleString('id-ID')}</td><td style="font-weight:bold;color:red">Rp ${sisa.toLocaleString('id-ID')}</td><td><span class="badge-belum">BELUM LUNAS</span></td><td><button class="btn-bayar" onclick="bukaBayar('${t.id}')">BAYAR</button></td><td style="font-size:10px">${riwayat}</td></tr>`;
 });
 document.getElementById('total_piutang').innerText='Rp '+total.toLocaleString('id-ID');
 document.getElementById('infoTotal').innerText=piutangData.length+' Piutang Beb';
}

window.bukaBayar=async id=>{
 idBayar=id; let snap=await getDoc(doc(db,"transaksi",id)); if(!snap.exists()) return; let t=snap.data();
 let cus=dataCustomer.find(c=>c.id==t.id_customer)||dataCustomerReguler.find(c=>c.id==t.id_customer);
 document.getElementById('bayar_invoice').value=t.no_invoice||''; document.getElementById('bayar_nama').value=cus?.nama_customer||'-';
 let sisa=parseInt(t.sisa_piutang)||(parseInt(t.total_bayar||0)-parseInt(t.deposit||0)); if(sisa<0) sisa=0;
 document.getElementById('bayar_sisa').value='Rp '+sisa.toLocaleString('id-ID'); document.getElementById('bayar_nominal').value=''; document.getElementById('bayar_nominal').max=sisa;
 document.getElementById('bayar_nominal').placeholder='Max Rp '+sisa.toLocaleString('id-ID');
 buktiBase64=''; document.getElementById('preview_bayar').style.display='none'; document.getElementById('infoUkuran').innerText='';
 let riwayat=t.riwayat_bayar||[]; let box=document.getElementById('riwayatBox');
 if(riwayat.length){ box.innerHTML='<b>Riwayat Bayar:</b><br>'+riwayat.map(r=>`• ${r.tanggal} - Rp ${parseInt(r.nominal).toLocaleString('id-ID')} ${r.bukti?`<a href="${r.bukti}" target="_blank">[Bukti]</a>`:''}`).join('<br>'); } else box.innerHTML='<i>Belum ada riwayat bayar Beb</i>';
 document.getElementById('modalBayar').style.display='block';
}
window.closeModal=()=>document.getElementById('modalBayar').style.display='none';

document.getElementById('bayar_bukti').addEventListener('change', e=>{
 fileAsli=e.target.files[0]; if(!fileAsli) return;
 document.getElementById('infoUkuran').innerText=(fileAsli.size/1024).toFixed(0)+'KB';
 let r=new FileReader(); r.onload=ev=>{ buktiBase64=ev.target.result; let p=document.getElementById('preview_bayar'); p.src=buktiBase64; p.style.display='inline-block'; if(fileAsli.size>800000) kompresBukti(); }; r.readAsDataURL(fileAsli);
});
window.kompresBukti=()=>{
 if(!buktiBase64) return; let img=new Image(); img.src=buktiBase64;
 img.onload=()=>{
  let c=document.createElement('canvas'); let maxW=700; let s=Math.min(maxW/img.width,maxW/img.height,1);
  c.width=img.width*s; c.height=img.height*s; c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  c.toBlob(b=>{ let r=new FileReader(); r.onload=ev=>{ buktiBase64=ev.target.result; document.getElementById('preview_bayar').src=buktiBase64; document.getElementById('infoUkuran').innerText=(b.size/1024).toFixed(0)+'KB ✅'; }; r.readAsDataURL(b); },'image/jpeg',0.6);
 }
}

document.getElementById('formBayar').addEventListener('submit', async e=>{
 e.preventDefault();
 if(buktiBase64 && buktiBase64.length>1100000){ alert('Bukti kegedean Beb! Klik 🗜️ Kompres dulu Beb!'); return; }
 let snap=await getDoc(doc(db,"transaksi",idBayar)); if(!snap.exists()) return; let t=snap.data();
 let bayar=parseInt(document.getElementById('bayar_nominal').value)||0;
 let sisaLama=parseInt(t.sisa_piutang)||(parseInt(t.total_bayar||0)-parseInt(t.deposit||0));
 if(bayar>sisaLama){ alert('Bayar melebihi sisa Beb! Max Rp '+sisaLama.toLocaleString('id-ID')); return; }
 let sisaBaru=sisaLama-bayar; let depositBaru=(parseInt(t.deposit||0)+bayar);
 let statusBaru=sisaBaru<=0?'Lunas':'Belum Lunas'; if(sisaBaru<=0) sisaBaru=0;
 let riwayat=t.riwayat_bayar||[]; riwayat.push({tanggal:new Date().toLocaleDateString('id-ID'), nominal:bayar, bukti:buktiBase64||''});
 let btn=document.getElementById('btnSimpanBayar'); btn.disabled=true; btn.innerText='Menyimpan...';
 try{
  await updateDoc(doc(db,"transaksi",idBayar), {deposit:depositBaru, sisa_piutang:sisaBaru, status_bayar:statusBaru, riwayat_bayar:riwayat});
  alert('✅ Pembayaran Rp '+bayar.toLocaleString('id-ID')+' berhasil Beb! Sisa Rp '+sisaBaru.toLocaleString('id-ID'));
  closeModal(); e.target.reset();
 }catch(err){ alert('Error Beb: '+err.message); }
 btn.disabled=false; btn.innerText='SIMPAN PEMBAYARAN';
});

window.onclick=e=>{ if(e.target==document.getElementById('modalBayar')) closeModal(); }
</script>
</body>
</html>
