<!DOCTYPE html>
<html>
<head>
<title>LAPORAN</title>
<style>
body { font-family: 'Segoe UI', Arial; background: #0a1629; margin: 0; padding: 20px; color: #333; }
.container { background: white; border: 3px solid #d4af37; border-radius: 8px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
.btn-kembali { background: #6c757d; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; margin-bottom: 15px; }
.tab { display: flex; gap: 5px; border-bottom: 2px solid #d4af37; margin-bottom: 20px; }
.tab button { padding: 10px 20px; border: none; background: #eee; cursor: pointer; font-weight: bold; }
.tab button.active { background: #d4af37; color: #000; }
h2 { color: #000; }
.toolbar { display:flex; gap:10px; margin-bottom:15px; align-items:center; }
.toolbar input { padding:8px; width:250px; border:1px solid #ccc; border-radius:4px; }
.btn-cetak { background:#17a2b8; color:white; border:none; padding:8px 15px; border-radius:4px; cursor:pointer; }
.btn-excel { background:#28a745; color:white; border:none; padding:8px 15px; border-radius:4px; cursor:pointer; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { background: #d4af37; color: #000; padding: 10px; border: 1px solid #aaa; }
td { padding: 8px; border: 1px solid #ddd; text-align: center; }
</style>
</head>
<body>

<div class="container">
    <button class="btn-kembali" onclick="window.location='index.html'">← Kembali</button>

    <div class="tab">
        <button class="active" onclick="gantiTab('transaksi', this)">LAPORAN TRANSAKSI</button>
        <button onclick="gantiTab('piutang', this)">LAPORAN PIUTANG</button>
        <button onclick="gantiTab('pendapatan', this)">LAPORAN PENDAPATAN</button>
    </div>

    <h2 id="judulLaporan">Laporan Semua Transaksi</h2>

    <div class="toolbar">
        <input type="text" id="searchNama" placeholder="🔍 Cari Nama Customer..." onkeyup="filterTabel()">
        <button class="btn-cetak" onclick="printPreview()">🖨️ Cetak Preview</button>
        <button class="btn-excel" onclick="exportExcel()">📊 Export Excel</button>
    </div>

    <table id="tabelLaporan">
        <thead id="headLaporan"></thead>
        <tbody></tbody>
    </table>
</div>

<script>
let dataTransaksi = JSON.parse(localStorage.getItem('dataTransaksi')) || [];
let dataCustomer = JSON.parse(localStorage.getItem('dataCustomer')) || []; 
let dataMobil = JSON.parse(localStorage.getItem('dataMobil')) || [];
let tabAktif = 'transaksi';

function getNamaCustomer(id) {
    let cust = dataCustomer.find(c => c.id == id || c.id_customer == id);
    return cust? (cust.nama || cust.nama_customer || cust.customer) : '-';
}
function getNamaMobil(id) {
    let mob = dataMobil.find(m => m.id == id || m.id_mobil == id);
    return mob? (mob.no_polisi || mob.no_pol || mob.plat || mob.mobil) : '-';
}

function gantiTab(tab, el){
    tabAktif = tab;
    document.querySelectorAll('.tab button').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
    tampilkanLaporan();
}

function tampilkanLaporan(){
    let tbody = document.querySelector('#tabelLaporan tbody');
    let thead = document.querySelector('#headLaporan');
    let judul = document.querySelector('#judulLaporan');
    tbody.innerHTML = '';

    if(tabAktif == 'transaksi'){
        judul.innerText = 'Laporan Semua Transaksi';
        thead.innerHTML = `<tr><th>No</th><th>Invoice</th><th>Customer</th><th>Mobil</th><th>Sewa</th><th>Total</th><th>Status</th></tr>`;
        dataTransaksi.forEach((t, i) => {
            tbody.innerHTML += `<tr>
                <td>${i+1}</td><td>${t.no_invoice || '-'}</td><td>${getNamaCustomer(t.id_customer)}</td>
                <td>${getNamaMobil(t.id_mobil)}</td><td>${t.tgl_sewa || '-'}</td>
                <td>Rp ${parseInt(t.total_bayar || 0).toLocaleString('id-ID')}</td><td>${t.status || 'Sewa'}</td>
            </tr>`;
        })

    } else if(tabAktif == 'piutang'){
        judul.innerText = 'Laporan Piutang';
        thead.innerHTML = `<tr><th>No</th><th>Invoice</th><th>Customer</th><th>Mobil</th><th>Sewa</th><th>Piutang</th></tr>`;
        // ANGGAP PIUTANG = YANG BELUM LUNAS
        let piutang = dataTransaksi.filter(t => t.status != 'Lunas');
        piutang.forEach((t, i) => {
            let sisa = parseInt(t.sisa_bayar || t.total_bayar || 0);
            if(sisa > 0){ // cuma tampilkan yg ada hutangnya
                tbody.innerHTML += `<tr>
                    <td>${i+1}</td><td>${t.no_invoice || '-'}</td><td>${getNamaCustomer(t.id_customer)}</td>
                    <td>${getNamaMobil(t.id_mobil)}</td><td>${t.tgl_sewa || '-'}</td>
                    <td style="color:red; font-weight:bold;">Rp ${sisa.toLocaleString('id-ID')}</td>
                </tr>`;
            }
        })

    } else if(tabAktif == 'pendapatan'){
        judul.innerText = 'Laporan Pendapatan';
        thead.innerHTML = `<tr><th>No</th><th>Invoice</th><th>Customer</th><th>Mobil</th><th>Sewa</th><th>Pendapatan</th></tr>`;
        // ANGGAP PENDAPATAN = YANG SUDAH LUNAS
        let lunas = dataTransaksi.filter(t => t.status == 'Lunas');
        if(lunas.length == 0){ // kalau belum ada yg lunas, tampilkan semua dulu sementara
            lunas = dataTransaksi; 
        }
        lunas.forEach((t, i) => {
            tbody.innerHTML += `<tr>
                <td>${i+1}</td><td>${t.no_invoice || '-'}</td><td>${getNamaCustomer(t.id_customer)}</td>
                <td>${getNamaMobil(t.id_mobil)}</td><td>${t.tgl_sewa || '-'}</td>
                <td style="color:green; font-weight:bold;">Rp ${parseInt(t.total_bayar || 0).toLocaleString('id-ID')}</td>
            </tr>`;
        })
    }
}
// SEARCH
function filterTabel(){
    let input = document.getElementById('searchNama').value.toLowerCase();
    let rows = document.querySelectorAll('#tabelLaporan tbody tr');
    rows.forEach(row => {
        let nama = row.cells[2].innerText.toLowerCase();
        row.style.display = nama.includes(input)? '' : 'none';
    })
}

// CETAK
function printPreview(){
    let printContents = document.getElementById('tabelLaporan').outerHTML;
    let win = window.open('', '', 'height=700,width=1000');
    win.document.write('<html><head><title>Preview</title><style>body{font-family:Arial;} h2{text-align:center;} table{width:100%; border-collapse:collapse;} th{background:#d4af37; color:#000; padding:8px;} td{padding:6px; border:1px solid #ddd; text-align:center;}</style></head><body>');
    win.document.write('<h2>'+document.getElementById('judulLaporan').innerText+'</h2>');
    win.document.write(printContents);
    win.document.write('</body></html>');
    win.document.close();
    win.print();
}

// EXPORT
function exportExcel(){
    let table = document.getElementById('tabelLaporan');
    let html = table.outerHTML;
    let url = 'data:application/vnd.ms-excel,' + encodeURIComponent(html);
    let a = document.createElement('a');
    a.href = url;
    a.download = document.getElementById('judulLaporan').innerText + '_' + new Date().toISOString().slice(0,10) + '.xls';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
}

tampilkanLaporan();
</script>

</body>
</html>
