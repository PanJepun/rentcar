<!DOCTYPE html>
<html>
<head>
    <title>TRANSAKSI PENYEWAAN</title>
    <style>
        body { font-family: 'Segoe UI', Arial; background: #0a1629; margin: 0; padding: 15px; color: #333; }
        h2 { text-align: center; color: #d4af37; font-size: 20px; margin: 5px 0 15px 0; font-weight: bold; }
       .box { background: white; border: 2px solid #d4af37; border-radius: 8px; padding: 20px; max-width: 1500px; margin: auto; }
       .form-grid { display: grid; grid-template-columns: 120px 1fr; gap: 10px 12px; align-items: center; font-size: 13px; }
       .form-grid label { font-weight: 500; text-align: right; }
       .form-grid input,.form-grid select { padding: 6px 8px; border: 1px solid #aaa; border-radius: 4px; width: 100%; box-sizing: border-box; }
       .form-grid input:disabled,.form-grid select:disabled { background: #e9ecef; cursor: not-allowed; }
       .radio-group { display: flex; gap: 20px; grid-column: 2/3; }
       .btn-simpan { background: #28a745; color: white; border: none; padding: 12px 25px; border-radius: 4px; cursor: pointer; font-size: 14px; font-weight: bold; }
       .btn-batal { background: #6c757d; color: white; border: none; padding: 12px 25px; border-radius: 4px; cursor: pointer; font-size: 14px; font-weight: bold; margin-left: 5px; display: none; }
       .btn-setup { background: #6c757d; color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; }
       .total-box { background: #d4af37; color: #000; padding: 12px; border-radius: 4px; text-align: center; font-size: 15px; font-weight: bold; grid-column: 2/3; }
       .info-piutang { background: #fff3cd; border: 1px solid #ffc107; padding: 8px; border-radius: 4px; font-size: 12px; grid-column: 2/3; color: #856404; font-weight: bold; }
       .info-box { background: #e8f4ff; padding: 6px 8px; border-radius: 4px; font-size: 12px; grid-column: 2/3; }
       .info-lock { background: #ffeeba; border: 1px solid #ffc107; padding: 4px 8px; border-radius: 4px; font-size: 11px; color: #856404; grid-column: 2/3; }
       .tabel-transaksi { width: 100%; border-collapse: collapse; font-size: 10px; }
       .tabel-transaksi th { background: #d4af37; color: #000; padding: 5px; text-align: center; }
       .tabel-transaksi td { border: 1px solid #ddd; padding: 4px; text-align: center; }
       .tabel-transaksi tr:nth-child(even) { background: #f9f9f9; }
       .badge-kredit { background: #ffc107; color: black; padding: 2px 6px; border-radius: 3px; font-size: 10px; font-weight: bold; }
       .badge-reguler { background: #17a2b8; color: white; padding: 2px 6px; border-radius: 3px; font-size: 10px; font-weight: bold; }
       .badge-lunas { background: #28a745; color: white; padding: 2px 6px; border-radius: 3px; font-size: 10px; font-weight: bold; }
       .badge-belum { background: #dc3545; color: white; padding: 2px 6px; border-radius: 3px; font-size: 10px; font-weight: bold; }
       .btn-aksi { padding: 3px 6px; border: none; border-radius: 3px; cursor: pointer; font-size: 9px; margin: 0 1px; font-weight: bold; }
       .btn-edit { background: #ffc107; color: #000; }
       .btn-hapus { background: #dc3545; color: #fff; }
       .btn-cetak { background: #007bff; color: #fff; }
       .alert { background: #ffdddd; border: 1px solid red; padding: 10px; border-radius: 4px; margin-bottom: 10px; font-size: 12px; }
       .preview-bukti { max-width: 100%; max-height: 80px; margin-top: 5px; border: 1px solid #ddd; border-radius: 4px; }
       .modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7); }
       .modal-content { background: #e8f5c8; margin: 5% auto; padding: 20px; border-radius: 8px; width: 60%; max-width: 700px; border: 2px solid #d4af37; }
       .close { float: right; font-size: 28px; font-weight: bold; cursor: pointer; }
       .form-customer { display: grid; grid-template-columns: 130px 1fr; gap: 10px 15px; align-items: center; }
       .btn-simpan-cus { background: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; }
       .overtime { color: red; font-weight: bold; }
    </style>
</head>
<body>

    <h2>TRANSAKSI PENYEWAAN</h2>
    <div class="box">
        <div id="alertMobil" class="alert" style="display:none;"></div>
        <div style="display:grid; grid-template-columns: 420px 1fr; gap:20px;">
            <div>
                <form id="formTransaksi" class="form-grid">
                    <label>No. Invoice :</label>
                    <div style="display:flex; gap:5px;">
                        <input type="text" id="no_invoice" readonly>
                        <button type="button" class="btn-setup" onclick="alert('Fitur Setup')">Setup</button>
                    </div>

                    <label>Jenis Customer :</label>
                    <div class="radio-group">
                        <label><input type="radio" name="jenis_cus" value="kredit" checked> Kredit</label>
                        <label><input type="radio" name="jenis_cus" value="reguler"> Reguler</label>
                    </div>

                    <label>Customer :</label>
                    <div>
                        <select id="id_customer" required><option value="">- Pilih Customer -</option></select>
                        <div id="info_customer" class="info-box"></div>
                    </div>

                    <label>Mobil :</label>
                    <div>
                        <select id="id_mobil" required><option value="">- Pilih Mobil -</option></select>
                    </div>

                    <label>Tgl Sewa :</label><input type="date" id="tgl_sewa" required>
                    <label>Jam Keluar :</label><input type="time" id="jam_keluar" value="08:00">
                    <label>Tgl Kembali :</label><input type="date" id="tgl_kembali">
                    <label>Jam Kembali :</label><input type="time" id="jam_kembali" value="18:00">
                    <label>Standar Sewa :</label><input type="number" id="standar_sewa" value="10" placeholder="Jam">
                    <label>KM Keluar :</label><input type="number" id="km_keluar" placeholder="0" required>
                    <label>KM Masuk :</label><input type="number" id="km_masuk" placeholder="0">
                    <label>Harga/Hari :</label><input type="number" id="harga" readonly>
                    <label>Jumlah Hari :</label><input type="text" id="jumlah_hari" readonly>
                    <label>Overtime :</label><input type="text" id="overtime" readonly>

                    <label>Deposit :</label><input type="number" id="deposit" placeholder="0" oninput="hitungTotal()">
                    <label>Upload Bukti :</label><input type="file" id="bukti_tf" accept="image/*">
                    <div id="preview_bukti" style="grid-column:2/3;"></div>

                    <label></label>
                    <div class="total-box">TOTAL: Rp <span id="total_bayar">0</span></div>
                    <div id="info_piutang" class="info-piutang" style="display:none;">SISA PIUTANG: Rp <span id="sisa_piutang">0</span></div>

                    <div style="grid-column:2/3;">
                        <button type="submit" id="btnSimpan" class="btn-simpan">SIMPAN TRANSAKSI</button>
                        <button type="button" id="btnBatal" class="btn-batal" onclick="batalEdit()">BATAL</button>
                    </div>
                </form>
            </div>

            <div>
                <h3 style="text-align:center; margin-top:0; color:#d4af37;">DATA TRANSAKSI SEWA</h3>
                <button style="background:#d4af37; color:#000; padding:8px 15px; border:none; border-radius:4px; cursor:pointer; margin-bottom:10px; font-weight:bold;" onclick="window.location='laporan.html'">📊 MENU LAPORAN</button>

                <div style="overflow-x:auto;">
                    <table class="tabel-transaksi">
                        <thead>
                            <tr>
                                <th>No</th><th>Invoice</th><th>Customer</th><th>Jenis</th>
                                <th>Mobil</th><th>Sewa</th><th>Kembali</th><th>Total</th><th>Deposit</th><th>Piutang</th><th>Status</th><th>Bukti</th><th>Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="tbodyTransaksi"><tr><td colspan="13">Belum ada data transaksi</td></tr></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div id="modalCustReguler" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModalCustReguler()">&times;</span>
            <h3>FORM CUSTOMER REGULER</h3>
            <form id="formCustReguler" class="form-customer">
                <label>No. KTP :</label><input type="text" id="reg_ktp" required>
                <label>Nama Customer :</label><input type="text" id="reg_nama" required>
                <label>No. HP / WA :</label><input type="text" id="reg_hp" required>
                <label>Email :</label><input type="email" id="reg_email">
                <label>Alamat :</label><textarea id="reg_alamat" rows="3" required></textarea>
                <label>Pekerjaan :</label><input type="text" id="reg_pekerjaan">
                <label>Jenis Kelamin :</label><select id="reg_jk" required><option value="">- Pilih -</option><option>Laki-laki</option><option>Perempuan</option></select>
                <div style="grid-column:1/3;"><button type="submit" class="btn-simpan-cus">Simpan</button></div>
            </form>
        </div>
    </div>

    <script>
        // ====== SETTING WA NOTIFIKASI - GANTI INI ======
        const WA_TOKEN = "ISI_TOKEN_FONNTE_KAMU_DISINI";
        const NOMOR_OWNER = "6281234567890"; // pake 62

        let dataCustomer = JSON.parse(localStorage.getItem('dataCustomer')) || [];
        let dataCustomerReguler = JSON.parse(localStorage.getItem('dataCustomerReguler')) || [];
        let dataMobil = JSON.parse(localStorage.getItem('dataMobil')) || [];
        let dataTransaksi = JSON.parse(localStorage.getItem('dataTransaksi')) || [];
        let setupInvoice = JSON.parse(localStorage.getItem('setupInvoice')) || { prefix: "AUTO", tahun: new Date().getFullYear(), digit: 4, nomor_terakhir: 0 };
        let idEdit = null;
        let buktiBase64 = '';

        // FUNGSI KIRIM WA DIEM2
        async function kirimNotifikasiWA(pesan) {
            try {
                await fetch("https://api.fonnte.com/send", {
                    method: "POST",
                    headers: { "Authorization": WA_TOKEN, "Content-Type": "application/json" },
                    body: JSON.stringify({ target: NOMOR_OWNER, message: pesan })
                });
            } catch (error) { console.error("Gagal kirim WA:", error); }
        }

        document.getElementById('bukti_tf').addEventListener('change', function (e) {
            let file = e.target.files[0];
            if (file) {
                let reader = new FileReader();
                reader.onload = function (evt) {
                    buktiBase64 = evt.target.result;
                    preview_bukti.innerHTML = `<img src="${buktiBase64}" class="preview-bukti">`;
                }
                reader.readAsDataURL(file);
            }
        });

        function loadTabelTransaksi() {
            let tbody = document.getElementById('tbodyTransaksi');
            if (dataTransaksi.length == 0) { tbody.innerHTML = '<tr><td colspan="13">Belum ada data transaksi</td></tr>'; return; }
            tbody.innerHTML = '';
            [...dataTransaksi].reverse().forEach((t, i) => {
                let cus = dataCustomer.find(c => c.id == t.id_customer) || dataCustomerReguler.find(c => c.id == t.id_customer);
                let mob = dataMobil.find(m => m.id == t.id_mobil);
                let badge = t.tipe_customer == 'reguler'? '<span class="badge-reguler">REGULER</span>' : '<span class="badge-kredit">KREDIT</span>';
                let statusBadge = t.status_bayar == 'Lunas'? '<span class="badge-lunas">LUNAS</span>' : '<span class="badge-belum">BELUM</span>';
                let piutang = (parseInt(t.total_bayar) - parseInt(t.deposit || 0));
                let bukti = t.bukti_tf? `<a href="${t.bukti_tf}" target="_blank"><img src="${t.bukti_tf}" style="width:40px; height:40px; object-fit:cover; border-radius:3px;"></a>` : '-';

                tbody.innerHTML += `<tr>
            <td>${i + 1}</td>
            <td>${t.no_invoice}</td>
            <td>${cus?.nama_customer || '-'}</td>
            <td>${badge}</td>
            <td>${mob?.plat || '-'}</td>
            <td>${t.tgl_sewa}</td>
            <td>${t.tgl_kembali}</td>
            <td>Rp ${parseInt(t.total_bayar).toLocaleString('id-ID')}</td>
            <td>Rp ${parseInt(t.deposit || 0).toLocaleString('id-ID')}</td>
            <td>Rp ${piutang.toLocaleString('id-ID')}</td>
            <td>${statusBadge}</td>
            <td>${bukti}</td>
            <td>
                <button class="btn-aksi btn-edit" onclick="editTransaksi(${t.id})">Edit</button>
                <button class="btn-aksi btn-hapus" onclick="hapusTransaksi(${t.id})">Hapus</button>
                <button class="btn-aksi btn-cetak" onclick="cetakInvoice(${t.id})">Cetak</button>
            </td>
        </tr>`;
            });
        }

        function loadDropdownMobil() {
            let selMob = document.getElementById('id_mobil');
            let alertBox = document.getElementById('alertMobil');
            selMob.innerHTML = '<option value="">- Pilih Mobil -</option>';
            dataMobil = JSON.parse(localStorage.getItem('dataMobil')) || [];
            if (dataMobil.length == 0) { alertBox.style.display = 'block'; alertBox.innerHTML = '⚠️ DATA MOBIL KOSONG!'; return; } else { alertBox.style.display = 'none'; }

            dataMobil.forEach(m => {
                let status = (m.status || 'ADA').toLowerCase();
                let harga = parseInt(m.harga || 0).toLocaleString('id-ID');
                if (['ada', 'tersedia'].includes(status) || m.id == idEdit) {
                    selMob.innerHTML += `<option value="${m.id}">${m.plat} | ${m.merk} | Rp ${harga}</option>`;
                }
            });

            if (idEdit) {
                selMob.disabled = true;
                if (!document.getElementById('info_lock_mobil')) {
                    let info = document.createElement('div');
                    info.id = 'info_lock_mobil';
                    info.className = 'info-lock';
                    info.innerHTML = '🔒 Mobil tidak bisa diganti saat edit';
                    selMob.parentNode.appendChild(info);
                }
            } else {
                selMob.disabled = false;
                let info = document.getElementById('info_lock_mobil');
                if (info) info.remove();
            }
        }

        document.querySelectorAll('input[name="jenis_cus"]').forEach(radio => {
            radio.addEventListener('change', function () {
                if (this.value == 'reguler') {
                    document.getElementById('modalCustReguler').style.display = 'block';
                    id_customer.required = false;
                    id_customer.innerHTML = '<option value="">- Isi Form Reguler Dulu -</option>';
                    info_piutang.style.display = 'none';
                } else {
                    loadDropdownKredit();
                    id_customer.required = true;
                }
            });
        });

        function closeModalCustReguler() {
            modalCustReguler.style.display = 'none';
            document.querySelector('input[name="jenis_cus"][value="kredit"]').checked = true;
            loadDropdownKredit();
        }

        document.getElementById('formCustReguler').addEventListener('submit', function (e) {
            e.preventDefault();
            let cusBaru = { id: Date.now(), no_ktp: reg_ktp.value, nama_customer: reg_nama.value, no_hp: reg_hp.value, email: reg_email.value, alamat: reg_alamat.value, pekerjaan: reg_pekerjaan.value, jenis_kelamin: reg_jk.value, status_customer: 'Aktif' };
            dataCustomerReguler.push(cusBaru);
            localStorage.setItem('dataCustomerReguler', JSON.stringify(dataCustomerReguler));
            id_customer.innerHTML = `<option value="${cusBaru.id}">${cusBaru.nama_customer}</option>`;
            id_customer.value = cusBaru.id;
            info_customer.innerHTML = `HP: ${cusBaru.no_hp} <span class="badge-reguler">REGULER</span>`;
            alert('✅ Data Customer Reguler Tersimpan');
            this.reset(); closeModalCustReguler();
        });

        function loadDropdownKredit() {
            id_customer.innerHTML = '<option value="">- Pilih Customer Kredit -</option>';
            dataCustomer.forEach(c => { if (c.status_customer == 'Aktif') id_customer.innerHTML += `<option value="${c.id}">${c.nama_customer}</option>`; });
        }

        function generateInvoice() { let nomorBaru = setupInvoice.nomor_terakhir + 1; let nomorFormat = String(nomorBaru).padStart(setupInvoice.digit, '0'); no_invoice.value = `${setupInvoice.prefix}/${setupInvoice.tahun}/${nomorFormat}`; }

        id_customer.addEventListener('change', function () { let c = dataCustomer.find(x => x.id == this.value) || dataCustomerReguler.find(x => x.id == this.value); if (c) { info_customer.innerHTML = `HP: ${c.no_hp}`; } });
        id_mobil.addEventListener('change', function () { let m = dataMobil.find(x => x.id == this.value); if (m) { harga.value = m.harga || 0; hitungTotal(); } });
        [tgl_sewa, jam_keluar, tgl_kembali, jam_kembali, standar_sewa, harga].forEach(el => el.addEventListener('input', hitungTotal));

        function hitungTotal() {
            let tgl1 = new Date(tgl_sewa.value + 'T' + jam_keluar.value);
            let tgl2 = new Date(tgl_kembali.value + 'T' + jam_kembali.value);
            let hargaVal = parseInt(harga.value) || 0;
            let standar = parseInt(standar_sewa.value) || 10;
            let depositVal = parseInt(deposit.value) || 0;

            if (tgl1 && tgl2 && tgl2 >= tgl1) {
                let selisihMs = tgl2 - tgl1;
                let selisihJam = selisihMs / (1000 * 60 * 60);
                let hari = Math.floor(selisihJam / 24);
                if (hari == 0) hari = 1;
                let sisaJam = selisihJam % 24;
                let overtime = 0;
                if (sisaJam > standar) { overtime = Math.ceil(sisaJam - standar); }
                let totalSewa = hari * hargaVal;
                let totalOT = overtime * (hargaVal * 0.1);
                let total = totalSewa + totalOT;
                let sisa = total - depositVal;
                if (sisa < 0) sisa = 0;

                jumlah_hari.value = hari;
                overtime.value = overtime > 0? overtime + ' Jam' : '0 Jam';
                total_bayar.innerText = total.toLocaleString('id-ID');
                sisa_piutang.innerText = sisa.toLocaleString('id-ID');
            } else {
                jumlah_hari.value = '';
                overtime.value = '';
                total_bayar.innerText = '0';
                sisa_piutang.innerText = '0';
            }

            if (document.querySelector('input[name="jenis_cus"]:checked').value == 'kredit') {
                info_piutang.style.display = 'block';
            } else {
                info_piutang.style.display = 'none';
            }
        }

        function editTransaksi(id) {
            idEdit = id;
            let t = dataTransaksi.find(x => x.id == id);
            if (!t) return;
            no_invoice.value = t.no_invoice;
            document.querySelector(`input[name="jenis_cus"][value="${t.tipe_customer}"]`).checked = true;
            if (t.tipe_customer == 'kredit') loadDropdownKredit(); else id_customer.innerHTML = `<option value="${t.id_customer}">Reguler</option>`;

            loadDropdownMobil();

            setTimeout(() => {
                id_customer.value = t.id_customer;
                id_mobil.value = t.id_mobil;
                id_mobil.dispatchEvent(new Event('change'));
            }, 100);

            tgl_sewa.value = t.tgl_sewa;
            jam_keluar.value = t.jam_keluar || '08:00';
            tgl_kembali.value = t.tgl_kembali;
            jam_kembali.value = t.jam_kembali || '18:00';
            standar_sewa.value = t.standar_sewa || 10;
            km_keluar.value = t.km_keluar;
            km_masuk.value = t.km_masuk;
            harga.value = t.harga;
            deposit.value = t.deposit || 0;
            if (t.bukti_tf) { buktiBase64 = t.bukti_tf; preview_bukti.innerHTML = `<img src="${t.bukti_tf}" class="preview-bukti">`; }
            hitungTotal();
            btnSimpan.innerHTML = 'UPDATE TRANSAKSI';
            btnSimpan.style.background = '#007bff';
            btnBatal.style.display = 'inline-block';
            window.scrollTo(0, 0);
        }

        function batalEdit() {
            idEdit = null;
            document.getElementById('formTransaksi').reset();
            buktiBase64 = ''; preview_bukti.innerHTML = '';
            btnSimpan.innerHTML = 'SIMPAN TRANSAKSI';
            btnSimpan.style.background = '#28a745';
            btnBatal.style.display = 'none';
            document.querySelector('input[name="jenis_cus"][value="kredit"]').checked = true;
            loadDropdownKredit(); loadDropdownMobil(); generateInvoice();
        }

        // ====== FUNGSI HAPUS + NOTIF WA ======
        function hapusTransaksi(id) {
            if (confirm('Yakin mau hapus transaksi ini?')) {
                let t = dataTransaksi.find(x => x.id == id);
                if(!t) return;

                let cus = dataCustomer.find(c => c.id == t.id_customer) || dataCustomerReguler.find(c => c.id == t.id_customer);
                let mob = dataMobil.find(m => m.id == t.id_mobil);
                let admin = "Admin"; // ganti: localStorage.getItem('nama_login') kalau ada

                // 1. SIMPAN LOG KE LOCALSTORAGE
                let logHapus = JSON.parse(localStorage.getItem('logHapus')) || [];
                logHapus.push({
                    waktu: new Date().toLocaleString('id-ID'),
                    admin: admin,
                    invoice: t.no_invoice,
                    customer: cus?.nama_customer || '-',
                    mobil: mob?.plat || '-',
                    total: t.total_bayar
                });
                localStorage.setItem('logHapus', JSON.stringify(logHapus));

                // 2. KIRIM WA KE OWNER
                let pesanWA = `⚠️ *ALERT HAPUS TRANSAKSI* ⚠️\n\n`;
                pesanWA += `Dihapus oleh: ${admin}\nWaktu: ${new Date().toLocaleString('id-ID')}\n\n`;
                pesanWA += `Invoice: ${t.no_invoice}\nCustomer: ${cus?.nama_customer || '-'}\nMobil: ${mob?.plat || '-'}\nTotal: Rp ${parseInt(t.total_bayar).toLocaleString('id-ID')}`;
                kirimNotifikasiWA(pesanWA);

                // 3. HAPUS DATA & KEMBALIKAN STATUS MOBIL
                let idxMobil = dataMobil.findIndex(m => m.id == t.id_mobil);
                if (idxMobil!= -1) { dataMobil[idxMobil].status = 'ADA'; localStorage.setItem('dataMobil', JSON.stringify(dataMobil)); }
                dataTransaksi = dataTransaksi.filter(x => x.id!= id);
                localStorage.setItem('dataTransaksi', JSON.stringify(dataTransaksi));

                alert('✅ Data dihapus. Owner sudah dinotifikasi via WA');
                loadTabelTransaksi();
                loadDropdownMobil();
            }
        }

        function cetakInvoice(id) {
            let t = dataTransaksi.find(x => x.id == id);
            if (!t) return;
            window.open(`invoice.html?id=${t.id}`, '_blank');
        }

        document.getElementById('formTransaksi').addEventListener('submit', function (e) {
            e.preventDefault();
            let jenis = document.querySelector('input[name="jenis_cus"]:checked').value;
            let totalVal = parseInt(total_bayar.innerText.replace(/[^0-9]/g, '')) || 0;
            let depositVal = parseInt(deposit.value) || 0;
            let sisa = totalVal - depositVal;
            let statusBayar = sisa <= 0? 'Lunas' : 'Belum Lunas';

            let trx = {
                id: idEdit || Date.now(), no_invoice: no_invoice.value, id_customer: id_customer.value, tipe_customer: jenis, id_mobil: id_mobil.value,
                tgl_sewa: tgl_sewa.value, jam_keluar: jam_keluar.value, tgl_kembali: tgl_kembali.value, jam_kembali: jam_kembali.value,
                standar_sewa: standar_sewa.value, km_keluar: km_keluar.value, km_masuk: km_masuk.value,
                jumlah_hari: jumlah_hari.value, overtime: overtime.value, harga: harga.value,
                total_bayar: totalVal, deposit: depositVal, sisa_piutang: sisa, status_bayar: statusBayar,
                bukti_tf: buktiBase64, status: 'Sewa'
            };

            if (idEdit) {
                let index = dataTransaksi.findIndex(x => x.id == idEdit);
                dataTransaksi[index] = trx;
                alert('✅ Transaksi berhasil diupdate!');
            } else {
                dataTransaksi.push(trx);
                setupInvoice.nomor_terakhir += 1;
                localStorage.setItem('setupInvoice', JSON.stringify(setupInvoice));
                let idx = dataMobil.findIndex(m => m.id == trx.id_mobil);
                if (idx!= -1) {
                    dataMobil[idx].status = 'KELUAR';
                    localStorage.setItem('dataMobil', JSON.stringify(dataMobil));
                }
                alert('✅ Transaksi tersimpan! No: ' + trx.no_invoice);
            }

            localStorage.setItem('dataTransaksi', JSON.stringify(dataTransaksi));
            batalEdit();
            loadTabelTransaksi();
        });

        loadDropdownKredit(); loadDropdownMobil(); generateInvoice(); loadTabelTransaksi();
    </script>
</body>
</html>
