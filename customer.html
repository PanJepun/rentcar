<!DOCTYPE html>
<html>
<head>
<title>MASTER DATA CUSTOMER</title>
<style>
body { font-family: 'Segoe UI', Arial; background: linear-gradient(135deg, #0a1629 0%, #12233a 100%); margin: 0; padding: 15px; color: #333; height: 100vh; overflow: hidden; }
h2 { text-align: center; color: #d4af37; font-size: 18px; margin: 5px 0 15px 0; }
.container { display: flex; gap: 15px; height: calc(100vh - 60px); }
.box { background: rgb(223, 236, 186); border: 2px solid #d4af37; border-radius: 8px; padding: 15px; box-shadow: 0 4px 15px rgba(190, 26, 26, 0.3); }
.box-kiri { width: 40%; }
.box-kanan { width: 60%; overflow-y: auto; }
.form-grid { display: grid; grid-template-columns: 120px 1fr; gap: 10px 12px; align-items: center; font-size: 13px; }
.form-grid label { font-weight: 500; text-align: right; }
.form-grid input,.form-grid select,.form-grid textarea { padding: 6px 8px; border: 1px solid #d8cf; border-radius: 4px; width: 100%; box-sizing: border-box; }
.form-grid input[type="file"] { grid-column: 2/3; border: none; }
.form-grid textarea { height: 60px; resize: vertical; }
.form-grid.full { grid-column: 1 / 3; }
.btn-simpan { background: #007bff; color: white; border: none; padding: 8px 25px; border-radius: 4px; cursor: pointer; font-size: 14px; font-weight: bold; margin-top: 10px; }
.btn-update { background: #28a745; }
.btn-batal { background: #6c757d; margin-left: 5px; }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
th { background: #d4af37; color: #000; padding: 8px; border: 1px solid #aaa; position: sticky; top: 0; }
td { padding: 6px; border: 1px solid #ddd; text-align: center; }
td img { width: 35px; height: 35px; object-fit: cover; border-radius: 50%; }
/* ==== AKSI 1 BARIS BEB ==== */
td.aksi-cell { white-space: nowrap; }
.aksi-wrap { display: flex; gap: 4px; justify-content: center; align-items: center; flex-wrap: nowrap; }
.btn-aksi { color: white; border: none; padding: 5px 7px; font-size: 11px; border-radius: 3px; cursor: pointer; margin: 0; line-height: 1; display: inline-flex; align-items: center; justify-content: center; }
.btn-edit { background: #ffc107; color: #000; font-size: 13px; }
.btn-hapus { background: #dc3545; font-size: 12px; }
.btn-detail { background: #17a2b8; }
.modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); }
.modal-content { background: white; margin: 5% auto; padding: 20px; border-radius: 8px; width: 50%; max-width: 500px; text-align: center; }
.modal-content h3 { text-align: center; color: #d4af37; }
.modal-content img { width: 120px; height: 120px; object-fit: cover; border-radius: 50%; border: 3px solid #d4af37; margin-bottom: 10px; }
.modal-grid { display: grid; grid-template-columns: 120px 1fr; gap: 8px; font-size: 13px; text-align: left; }
.close { float: right; font-size: 28px; font-weight: bold; cursor: pointer; }
.foto-thumb { width: 35px; height: 35px; object-fit: cover; border-radius: 50%; cursor: zoom-in; border: 2px solid #d4af37; }
.foto-thumb:hover { transform: scale(1.1); transition: 0.2s; }
#modalZoom { display: none; position: fixed; z-index: 999; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); }
#modalZoom img { margin: auto; display: block; max-width: 85%; max-height: 85%; margin-top: 4%; border: 3px solid #d4af37; border-radius: 8px; }
#modalZoom .close-zoom { position: absolute; top: 20px; right: 35px; color: #fff; font-size: 40px; font-weight: bold; cursor: pointer; }
</style>
</head>
<body>
<h2>MASTER DATA CUSTOMER</h2>
<div class="container">
    <div class="box box-kiri">
        <form id="formCustomer" class="form-grid">
            <input type="hidden" id="edit_id">
            <label>No. KTP :</label><input type="text" id="no_ktp" required>
            <label>Nama Customer :</label><input type="text" id="nama_customer" required>
            <label>No. HP / WA :</label><input type="text" id="no_hp">
            <label>Email :</label><input type="text" id="email">
            <label>Alamat :</label><textarea id="alamat" class="full"></textarea>
            <label>Pekerjaan :</label><input type="text" id="pekerjaan">
            <label>Jenis Kelamin :</label><select id="jk"><option value="">- Pilih -</option><option value="Laki-laki">Laki-laki</option><option value="Perempuan">Perempuan</option></select>
            <label>Limit Kredit :</label><input type="number" id="limit_kredit" placeholder="0">
            <label>Foto Customer :</label><input type="file" id="foto" accept="image/*">
            <label>Status :</label><select id="status_customer"><option value="Aktif">Aktif</option><option value="Blacklist">Blacklist</option></select><label></label><span></span>
            <div class="full"><button type="submit" id="btnSimpan" class="btn-simpan">Simpan</button><button type="button" id="btnBatal" class="btn-simpan btn-batal" onclick="batalEdit()" style="display:none;">Batal</button></div>
        </form>
        <p id="statusFirebase" style="font-size:12px;text-align:center;margin-top:8px;font-weight:bold;">⏳ Menghubungkan ke Firebase rental2026...</p>
    </div>
    <div class="box box-kanan">
        <table id="tabelCustomer"><thead><tr><th>Foto</th><th>No KTP</th><th>Nama</th><th>No HP</th><th>Limit Kredit</th><th>Status</th><th>Aksi</th></tr></thead><tbody></tbody></table>
    </div>
</div>
<div id="modalDetail" class="modal"><div class="modal-content"><span class="close">&times;</span><h3>DETAIL DATA CUSTOMER</h3><img id="detail_foto"><div class="modal-grid" id="detail_body"></div></div></div>
<div id="modalZoom"><span class="close-zoom" onclick="document.getElementById('modalZoom').style.display='none'">&times;</span><img id="imgZoom"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAYDuYpHiGqKLaG_E__fp-h00pUIAZgV7Vs",
  authDomain: "rental2026.firebaseapp.com",
  databaseURL: "https://rental2026-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "rental2026",
  storageBucket: "rental2026.firebasestorage.app",
  messagingSenderId: "460493800655",
  appId: "1:460493800655:web:cac5f561fc219e764a23ba",
  measurementId: "G-0WP2H6PRS2"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const colCustomer = collection(db, "customer");
let dataCustomer = [];
let modeEdit = false;
let fotoBase64 = "";

document.getElementById('foto').addEventListener('change', function(e){
    let file = e.target.files[0];
    if(file){
        let reader = new FileReader();
        reader.onload = function(event){
            let img = new Image();
            img.onload = function(){
                let canvas = document.createElement('canvas');
                let scale = Math.min(1, 800 / img.width);
                canvas.width = img.width * scale; canvas.height = img.height * scale;
                canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                fotoBase64 = canvas.toDataURL('image/jpeg', 0.7);
            }
            img.src = event.target.result;
        }
        reader.readAsDataURL(file);
    }
});
document.getElementById('formCustomer').addEventListener('keydown', function(e){
    if(e.key === 'Enter' && e.target.tagName!== 'BUTTON' && e.target.tagName!== 'TEXTAREA'){
        e.preventDefault();
        const inputs = Array.from(this.querySelectorAll('input, select, textarea, button'));
        const index = inputs.indexOf(e.target);
        if(index > -1 && index < inputs.length - 1){ inputs[index + 1].focus(); }
    }
});
document.getElementById('formCustomer').addEventListener('submit', async function(e){
    e.preventDefault();
    let customer = {};
    this.querySelectorAll('input, select, textarea').forEach(el => { if(el.id!== 'edit_id' && el.id!== 'foto') customer[el.id] = el.value; });
    let id = document.getElementById('edit_id').value;
    customer.foto = fotoBase64 || dataCustomer.find(c=>c.id==id)?.foto || "";
    try{
        if(modeEdit){ await updateDoc(doc(db, "customer", id), customer); alert('✅ Data Customer diupdate ke Firebase!'); batalEdit(); }
        else { await addDoc(colCustomer, customer); alert('✅ Data Customer tersimpan ke Firebase!'); }
        this.reset(); fotoBase64 = "";
    }catch(err){ alert('❌ GAGAL: ' + err.code + '\n' + err.message); }
});
onSnapshot(colCustomer, (snapshot)=>{
    dataCustomer = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
    document.getElementById('statusFirebase').innerText = '✅ FIREBASE rental2026 TERHUBUNG - Total: ' + dataCustomer.length + ' customer';
    document.getElementById('statusFirebase').style.color = 'green';
    tampilkanTabel();
}, (err)=>{ document.getElementById('statusFirebase').innerText = '❌ FIREBASE ERROR: ' + err.message; document.getElementById('statusFirebase').style.color = 'red'; });

function tampilkanTabel(){
    let tbody = document.querySelector('#tabelCustomer tbody');
    tbody.innerHTML = '';
    dataCustomer.forEach(c => {
        let limit = c.limit_kredit? 'Rp ' + parseInt(c.limit_kredit).toLocaleString('id-ID') : '-';
        let foto = c.foto? `<img src="${c.foto}" class="foto-thumb" data-foto="${c.foto}">` : '-';
        tbody.innerHTML += `<tr><td>${foto}</td><td>${c.no_ktp || ''}</td><td>${c.nama_customer || ''}</td><td>${c.no_hp || ''}</td><td>${limit}</td><td><b>${c.status_customer || ''}</b></td><td class="aksi-cell"><div class="aksi-wrap"><button class="btn-aksi btn-detail" data-id="${c.id}" data-act="detail">Detail</button><button class="btn-aksi btn-edit" data-id="${c.id}" data-act="edit" title="Edit">✏️</button><button class="btn-aksi btn-hapus" data-id="${c.id}" data-act="hapus" title="Hapus">❌</button></div></td></tr>`;
    });
    tbody.querySelectorAll('img.foto-thumb').forEach(img=>{ img.ondblclick = ()=> zoomFoto(img.dataset.foto); });
    tbody.querySelectorAll('button').forEach(btn=>{ btn.onclick = ()=>{ let id = btn.dataset.id; if(btn.dataset.act=='detail') detailData(id); if(btn.dataset.act=='edit') editData(id); if(btn.dataset.act=='hapus') hapus(id); } });
}
window.editData = function(id){
    let c = dataCustomer.find(x=>x.id==id); if(!c) return;
    document.getElementById('edit_id').value = c.id;
    document.getElementById('no_ktp').value = c.no_ktp || '';
    document.getElementById('nama_customer').value = c.nama_customer || '';
    document.getElementById('no_hp').value = c.no_hp || '';
    document.getElementById('email').value = c.email || '';
    document.getElementById('alamat').value = c.alamat || '';
    document.getElementById('pekerjaan').value = c.pekerjaan || '';
    document.getElementById('jk').value = c.jk || '';
    document.getElementById('limit_kredit').value = c.limit_kredit || '';
    document.getElementById('status_customer').value = c.status_customer || 'Aktif';
    fotoBase64 = c.foto || "";
    modeEdit = true;
    document.getElementById('btnSimpan').innerText = 'Update Data';
    document.getElementById('btnSimpan').classList.add('btn-update');
    document.getElementById('btnBatal').style.display = 'inline-block';
}
window.batalEdit = function(){
    modeEdit = false;
    document.getElementById('formCustomer').reset();
    document.getElementById('edit_id').value = "";
    fotoBase64 = "";
    document.getElementById('btnSimpan').innerText = 'Simpan';
    document.getElementById('btnSimpan').classList.remove('btn-update');
    document.getElementById('btnBatal').style.display = 'none';
}
window.detailData = function(id){
    let c = dataCustomer.find(x=>x.id==id);
    document.getElementById('detail_foto').src = c.foto || '';
    let body = '';
    for(let key in c){ if(key!='id' && key!='foto'){ let label = key.replace('_',' ').toUpperCase(); let value = c[key]; if(key == 'limit_kredit' && value) value = 'Rp ' + parseInt(value).toLocaleString('id-ID'); body += `<b>${label}:</b><span>${value || '-'}</span>`; } }
    document.getElementById('detail_body').innerHTML = body;
    document.getElementById('modalDetail').style.display = 'block';
}
window.hapus = async function(id){ if(confirm('Yakin hapus data customer ini?')){ await deleteDoc(doc(db, "customer", id)); } }
window.zoomFoto = function(src){ document.getElementById('imgZoom').src = src; document.getElementById('modalZoom').style.display = 'block'; }
document.querySelector('.close').onclick = function(){ document.getElementById('modalDetail').style.display = 'none'; }
window.onclick = function(event){ if(event.target==document.getElementById('modalDetail')) document.getElementById('modalDetail').style.display = 'none'; if(event.target==document.getElementById('modalZoom')) document.getElementById('modalZoom').style.display = 'none'; }
</script>
</body>
</html>
