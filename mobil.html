<!DOCTYPE html>
<html>
<head>
<title>INFORMASI ARMADA MOBIL & SEPEDA MOTOR</title>
<style>
body { font-family: 'Segoe UI', Arial; background: linear-gradient(135deg, #0a1629 0%, #12233a 100%); margin: 0; padding: 15px; color: #333; height: 100vh; overflow: hidden; }
h2 { text-align: center; color: #d4af37; font-size: 18px; margin: 5px 0 15px 0; }
.container { display: flex; gap: 15px; height: calc(100vh - 60px); }
.box { background: #f7eb81; border: 2px solid #d4af37; border-radius: 8px; padding: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
.box-kiri { width: 50%; }
.box-kanan { width: 50%; overflow-y: auto; }
.form-grid { display: grid; grid-template-columns: 110px 1fr 110px 1fr; gap: 8px 12px; align-items: center; font-size: 13px; }
.form-grid label { font-weight: 500; text-align: right; }
.form-grid input,.form-grid select { padding: 5px 8px; border: 1px solid #aaa; border-radius: 4px; height: 26px; width: 100%; box-sizing: border-box; }
.form-grid input[type="file"] { grid-column: 2 / 5; height: auto; border: none; }
.form-grid.full { grid-column: 1 / 5; }
input#tahun, input#cc, input#penumpang { width: 130px; }
.btn-simpan { background: #007bff; color: white; border: none; padding: 8px 25px; border-radius: 4px; cursor: pointer; font-size: 14px; font-weight: bold; margin-top: 10px; }
.btn-update { background: #28a745; }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
th { background: #d4af37; color: #000; padding: 8px; border: 1px solid #aaa; }
td { padding: 6px; border: 1px solid #ddd; text-align: center; }
td img { width: 40px; height: 28px; object-fit: cover; }
/* ==== AKSI 1 BARIS BEB ==== */
td.aksi-cell { white-space: nowrap; }
.aksi-wrap { display: flex; gap: 4px; justify-content: center; align-items: center; flex-wrap: nowrap; }
.btn-aksi { color: white; border: none; padding: 4px 7px; font-size: 11px; border-radius: 3px; cursor: pointer; margin: 0; line-height: 1; display: inline-flex; align-items: center; justify-content: center; }
.btn-edit { background: #ffc107; color: #000; font-size: 13px; padding: 5px 7px; }
.btn-hapus { background: #dc3545; font-size: 12px; padding: 5px 7px; }
.btn-detail { background: #17a2b8; padding: 5px 7px; }
.Ada { background: #e8f5e9; }.Keluar { background: #e3f2fd; }
.modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); }
.modal-content { background: white; margin: 5% auto; padding: 20px; border-radius: 8px; width: 60%; max-width: 600px; }
.modal-content h3 { text-align: center; color: #d4af37; }
.modal-content img { width: 100%; max-height: 250px; object-fit: contain; margin-bottom: 10px; }
.modal-grid { display: grid; grid-template-columns: 120px 1fr; gap: 8px; font-size: 13px; }
.close { float: right; font-size: 28px; font-weight: bold; cursor: pointer; }
</style>
</head>
<body>
<h2>INFORMASI ARMADA MOBIL & SEPEDA MOTOR</h2>
<div class="container">
    <div class="box box-kiri">
        <form id="formMobil" class="form-grid">
            <input type="hidden" id="edit_id">
            <label>No. Polisi :</label><input type="text" id="plat" required><label></label><span></span>
            <label>Nama Pemilik :</label><input type="text" id="nama_pemilik">
            <label>Merk :</label><input type="text" id="merk">
            <label>Alamat Pemilik :</label><input type="text" id="alamat_pemilik" class="full">
            <label>Type :</label><input type="text" id="type">
            <label>Status :</label><select id="kepemilikan"><option>Milik Sendiri</option><option>Titipan</option></select>
            <label>Tahun :</label><input type="number" id="tahun">
            <label>Warna :</label><input type="text" id="warna">
            <label>Isi Silinder :</label><input type="number" id="cc">
            <label>Bahan Bakar :</label><input type="text" id="bbm">
            <label>Jumlah Penumpang :</label><input type="number" id="penumpang" value="4">
            <label>Transmisi :</label><select id="transmisi"><option value="">- Pilih -</option><option value="Manual">Manual</option><option value="Matic">Matic</option></select>
            <label>No Rangka :</label><input type="text" id="no_rangka">
            <label>No Mesin :</label><input type="text" id="no_mesin">
            <label>No. BPKB :</label><input type="text" id="no_bpkb">
            <label>Harga/Hari :</label><input type="number" id="harga">
            <label>Berlaku Sd :</label><input type="date" id="tgl_stnk"><label></label><span></span>
            <label>Foto Mobil :</label><input type="file" id="foto" accept="image/*">
            <label>Status Unit :</label><select id="status_mobil"><option>Ada</option><option>Keluar</option><option>Service</option><option>Rusak</option></select><label></label><span></span>
            <button type="submit" id="btnSimpan" class="btn-simpan full">Simpan</button>
        </form>
        <p id="statusFirebase" style="font-size:12px;text-align:center;margin-top:8px;font-weight:bold;">⏳ Menghubungkan ke Firebase rental2026...</p>
    </div>
    <div class="box box-kanan">
        <table id="tabelMobil"><thead><tr><th>Foto</th><th>No Polisi</th><th>Nama</th><th>Merk</th><th>Type</th><th>Tahun</th><th>Penumpang</th><th>Transmisi</th><th>Status</th><th>Aksi</th></tr></thead><tbody></tbody></table>
    </div>
</div>
<div id="modalDetail" class="modal"><div class="modal-content"><span class="close">&times;</span><h3>DETAIL DATA MOBIL</h3><img id="detail_foto"><div class="modal-grid" id="detail_body"></div></div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAYDuYpHiGqKLaG_E__fp-h00pUIAZgV7Vs",
  authDomain: "rental2026.firebaseapp.com",
  databaseURL: "https://rental2026-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "rental2026",
  storageBucket: "rental2026.firebasestorage.app",
  messagingSenderId: "460493800655",
  appId: "1:460493800655:web:cac5f561fc219e764a23ba",
  measurementId: "G-0WP2H6PRS2"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const colMobil = collection(db, "armada_mobil");
let dataMobil = [];
let fotoBase64 = "";
let modeEdit = false;

document.getElementById('formMobil').addEventListener('keydown', function(e){
    if(e.key === 'Enter' && e.target.tagName!== 'BUTTON'){
        e.preventDefault();
        const inputs = Array.from(this.querySelectorAll('input, select, button'));
        const index = inputs.indexOf(e.target);
        if(index > -1 && index < inputs.length - 1){ inputs[index + 1].focus(); }
    }
});
document.getElementById('foto').addEventListener('change', function(e){
    let file = e.target.files[0];
    if(file){
        let reader = new FileReader();
        reader.onload = function(event){
            let img = new Image();
            img.onload = function(){
                let canvas = document.createElement('canvas');
                let scale = Math.min(1, 800 / img.width);
                canvas.width = img.width * scale; canvas.height = img.height * scale;
                canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                fotoBase64 = canvas.toDataURL('image/jpeg', 0.7);
            }
            img.src = event.target.result;
        }
        reader.readAsDataURL(file);
    }
});
document.getElementById('formMobil').addEventListener('submit', async function(e){
    e.preventDefault();
    let id = document.getElementById('edit_id').value;
    let mobil = {};
    this.querySelectorAll('input, select').forEach(el => { if(el.id!= 'foto' && el.id!= 'edit_id') mobil[el.id] = el.value; });
    mobil.foto = fotoBase64 || dataMobil.find(m=>m.id==id)?.foto || "";
    try {
        if(modeEdit){ await updateDoc(doc(db, "armada_mobil", id), mobil); alert('✅ Update ke Firebase BERHASIL!'); modeEdit = false; document.getElementById('btnSimpan').innerText = 'Simpan'; document.getElementById('btnSimpan').classList.remove('btn-update'); }
        else { await addDoc(colMobil, mobil); alert('✅ Simpan ke Firebase BERHASIL!'); }
        this.reset(); fotoBase64 = ""; document.getElementById('edit_id').value = "";
    } catch(err){ alert('❌ GAGAL: ' + err.code + '\n' + err.message); console.error(err); }
});
onSnapshot(colMobil, (snapshot)=>{
    dataMobil = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
    document.getElementById('statusFirebase').innerText = '✅ FIREBASE rental2026 TERHUBUNG - Total: ' + dataMobil.length + ' unit';
    document.getElementById('statusFirebase').style.color = 'green';
    tampilkanTabel();
}, (err)=>{ document.getElementById('statusFirebase').innerText = '❌ FIREBASE ERROR: ' + err.message; document.getElementById('statusFirebase').style.color = 'red'; });
function tampilkanTabel(){
    let tbody = document.querySelector('#tabelMobil tbody'); tbody.innerHTML = '';
    dataMobil.forEach(m => {
        tbody.innerHTML += `<tr class="${m.status_mobil}"><td><img src="${m.foto || ''}"></td><td>${m.plat || ''}</td><td>${m.nama_pemilik || ''}</td><td>${m.merk || ''}</td><td>${m.type || ''}</td><td>${m.tahun || ''}</td><td>${m.penumpang || '-'}</td><td>${m.transmisi || ''}</td><td><b>${m.status_mobil || ''}</b></td><td class="aksi-cell"><div class="aksi-wrap"><button class="btn-aksi btn-detail" data-id="${m.id}" data-act="detail">Detail</button><button class="btn-aksi btn-edit" data-id="${m.id}" data-act="edit" title="Edit">✏️</button><button class="btn-aksi btn-hapus" data-id="${m.id}" data-act="hapus" title="Hapus">❌</button></div></td></tr>`;
    });
    tbody.querySelectorAll('button').forEach(btn=>{ btn.onclick = ()=>{ let id = btn.dataset.id; if(btn.dataset.act=='detail') detailData(id); if(btn.dataset.act=='edit') editData(id); if(btn.dataset.act=='hapus') hapus(id); } });
}
window.editData = function(id){
    let m = dataMobil.find(x=>x.id==id); if(!m) return;
    document.getElementById('edit_id').value = m.id;
    ['plat','nama_pemilik','merk','alamat_pemilik','type','kepemilikan','tahun','warna','cc','bbm','penumpang','transmisi','no_rangka','no_mesin','no_bpkb','harga','tgl_stnk','status_mobil'].forEach(k=>{ let el = document.getElementById(k); if(el) el.value = m[k] || ''; });
    fotoBase64 = m.foto || ""; modeEdit = true; document.getElementById('btnSimpan').innerText = 'Update Data'; document.getElementById('btnSimpan').classList.add('btn-update');
}
window.detailData = function(id){
    let m = dataMobil.find(x=>x.id==id);
    document.getElementById('detail_foto').src = m.foto || '';
    let body = ''; for(let key in m){ if(key!='id' && key!='foto'){ body += `<b>${key.replace('_',' ').toUpperCase()}:</b><span>${m[key] || '-'}</span>`; } }
    document.getElementById('detail_body').innerHTML = body; document.getElementById('modalDetail').style.display = 'block';
}
window.hapus = async function(id){ if(confirm('Yakin hapus?')){ await deleteDoc(doc(db, "armada_mobil", id)); } }
document.querySelector('.close').onclick = function(){ document.getElementById('modalDetail').style.display = 'none'; }
window.onclick = function(event){ if(event.target==document.getElementById('modalDetail')) document.getElementById('modalDetail').style.display = 'none'; }
</script>
</body>
</html>
