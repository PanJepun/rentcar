<!DOCTYPE html>
<html>
<head>
<title>DATA CUSTOMER REGULER - FINAL LEBAR CAKEP</title>
<style>
body{font-family:'Segoe UI',Arial;background:#0a1629;margin:0;padding:10px}
h2{text-align:center;color:#d4af37;font-size:16px;margin:0 0 8px 0}
.box{background:white;border:2px solid #d4af37;border-radius:6px;padding:10px;max-width:1400px;margin:auto}
.btn-tambah{background:#28a745;color:white;border:none;padding:6px 12px;border-radius:4px;cursor:pointer;font-size:11px;font-weight:bold}
.tabel{width:100%;border-collapse:collapse;font-size:11px;white-space:nowrap}
.tabel th{background:#d4af37;padding:5px;font-size:11px;position:sticky;top:0}
.tabel td{border:1px solid #ddd;padding:4px;height:26px}
.tabel img{width:26px;height:26px;object-fit:cover;border-radius:3px;border:1px solid #d4af37;cursor:zoom-in}

/* MODAL FINAL LEBAR BEB */
.modal{display:none;position:fixed;z-index:100;left:0;top:0;width:100%;height:100%;background:rgba(0,0,0,0.75)}
.modal-content{background:#e8f3b8;margin:0.8% auto;padding:0;width:860px;max-width:96%;border-radius:8px;border:2px solid #bfa145;box-shadow:0 10px 30px rgba(0,0,0,0.5);overflow:hidden}
.modal-header{padding:12px 18px 6px;display:flex;justify-content:space-between;align-items:center}
.modal-header h3{margin:0;font-size:14px;font-weight:bold}
.close{font-size:20px;font-weight:bold;cursor:pointer}
.modal-body{padding:0 20px 14px}

/* SEMUA KOLOM LEBAR BEB */
.section-title{font-weight:bold;font-size:12px;border-bottom:1.5px solid #c9b35a;margin:14px 0 10px;padding-bottom:3px;grid-column:1/5}
.form-customer{display:grid;grid-template-columns:128px 265px 138px 265px;gap:11px 14px;align-items:center;font-size:12px;justify-content:center}
.form-customer label{font-size:12px;white-space:nowrap}
.form-customer input,.form-customer select,.form-customer textarea{padding:7px 9px;border:1px solid #999;border-radius:4px;width:100%;box-sizing:border-box;height:36px;font-size:12px;background:white}
.form-customer textarea{height:52px}
.form-customer input:focus,.form-customer select:focus,.form-customer textarea:focus{outline:2px solid #d4af37;background:#fffde7}
.btn-simpan-cus{background:#0b7bff;color:white;border:none;padding:8px 22px;border-radius:5px;cursor:pointer;font-weight:bold;font-size:12px;margin-top:14px}
.btn-kompres{background:#ff6f00;color:white;border:none;padding:4px 8px;border-radius:4px;cursor:pointer;font-size:10px;font-weight:bold;margin-left:4px}
.foto-preview{width:52px;height:52px;object-fit:cover;border-radius:4px;border:1px solid #999;margin-left:6px}
</style>
</head>
<body>

<h2>DATA CUSTOMER REGULER - rental2026 [FINAL LEBAR]</h2>
<div class="box">
    <div style="display:flex;gap:8px;margin-bottom:6px"><button class="btn-tambah" onclick="openModalTambah()">+ TAMBAH CUSTOMER REGULER</button><input type="text" id="cari" placeholder="🔍 Cari..." style="padding:4px 8px;border-radius:4px;border:1px solid #aaa;font-size:11px;width:220px"><span id="infoTotal" style="margin-left:auto;font-size:11px;font-weight:bold"></span></div>
    <div style="overflow:auto;max-height:86vh"><table class="tabel"><thead><tr><th>No</th><th>Foto</th><th>No KTP/Passport</th><th>Nama</th><th>No HP</th><th>Email</th><th>Alamat</th><th>Kebangsaan</th><th>No SIM</th><th>Insurance</th><th>Jml Sewa</th><th>Total</th><th>Status</th><th>Aksi</th></tr></thead><tbody id="tbodyReguler"><tr><td colspan="14">Loading Firebase Beb...</td></tr></tbody></table></div>
</div>

<div id="modalCustReguler" class="modal">
  <div class="modal-content">
    <div class="modal-header"><h3>FORM CUSTOMER REGULER - TAMBAH</h3><span class="close" onclick="closeModal()">✕</span></div>
    <div class="modal-body">
    <form id="formCustReguler" class="form-customer">
        <input type="hidden" id="id_edit">
        <div class="section-title">DATA PRIBADI</div>

        <label>No. KTP/Passport :</label><input type="text" id="reg_ktp" required placeholder="KTP 16 digit muat Beb">
        <label>Nama Customer :</label><input type="text" id="reg_nama" required placeholder="Nama lengkap">

        <label>Kebangsaan :</label><input type="text" id="reg_nationality" value="Indonesia">
        <label>No. SIM / Driving License :</label><input type="text" id="reg_sim" placeholder="SIM A/B/C">

        <label>No. HP / WA :</label><input type="text" id="reg_hp" required>
        <label>Email :</label><input type="email" id="reg_email">

        <label>Instagram :</label><input type="text" id="reg_ig" placeholder="@username">
        <label>Jenis Kelamin :</label><select id="reg_jk"><option value="">- Pilih -</option><option>Laki-laki</option><option>Perempuan</option></select>

        <div class="section-title">ALAMAT</div>

        <label>Alamat Sementara :</label><textarea id="reg_alamat_sementara" required placeholder="Hotel / Villa / Kos"></textarea>
        <label>Room No :</label><input type="text" id="reg_room">

        <label>Alamat Tetap :</label><textarea id="reg_alamat_tetap" placeholder="Alamat KTP"></textarea>
        <label>Pekerjaan :</label><input type="text" id="reg_pekerjaan">

        <div class="section-title">LAINNYA</div>

        <label>No. Helm :</label><input type="text" id="reg_helm" placeholder="Ukuran M/L/XL">
        <label>Default Insurance :</label><input type="number" id="reg_insurance" value="1400000">

        <label>Status :</label><select id="reg_status"><option value="Aktif">Aktif</option><option value="Non-Aktif">Non-Aktif</option></select>
        <label>Upload Foto :</label>
        <div style="display:flex;align-items:center">
            <input type="file" id="reg_foto" accept="image/*" style="width:150px;font-size:11px">
            <button type="button" class="btn-kompres" onclick="kompresFoto()">🗜️ Kompres</button>
            <img id="preview_img" class="foto-preview" style="display:none">
            <span id="infoUkuran" style="font-size:10px;font-weight:bold;margin-left:4px"></span>
        </div>

        <div style="grid-column:1/5"><button type="submit" class="btn-simpan-cus" id="btnSimpan">SIMPAN</button></div>
    </form>
    </div>
  </div>
</div>

<div id="modalZoom" style="display:none;position:fixed;z-index:999;left:0;top:0;width:100%;height:100%;background:rgba(0,0,0,0.9)"><span style="position:absolute;top:12px;right:22px;color:#fff;font-size:32px;cursor:pointer" onclick="this.parentElement.style.display='none'">&times;</span><img id="imgZoom" style="margin:auto;display:block;max-width:85%;max-height:85%;margin-top:4%;border:2px solid #d4af37;border-radius:6px"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, doc, deleteDoc, updateDoc, getDoc } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
const firebaseConfig = { apiKey: "AIzaSyAYDuYpHiGqKLagE__fp-h00pUIAZGv7Vs", authDomain: "rental2026.firebaseapp.com", projectId: "rental2026", storageBucket: "rental2026.firebasestorage.app", messagingSenderId: "460493800655", appId: "1:460493800655:web:cac5f561fc219e764a23ba" };
const app = initializeApp(firebaseConfig); const db = getFirestore(app);
const colRef = collection(db, "customers_reguler");
let idEdit=null,fotoBase64='',fotoLama='',fileAsli=null,allData=[];

document.getElementById('formCustReguler').addEventListener('keydown',e=>{ if(e.key==='Enter'&&e.target.tagName!=='TEXTAREA'&&e.target.type!=='submit'){ e.preventDefault(); const els=Array.from(document.querySelectorAll('#formCustReguler input, #formCustReguler select, #formCustReguler textarea')); const i=els.indexOf(e.target); if(i>-1&&i+1<els.length) els[i+1].focus(); }});
document.getElementById('reg_foto').addEventListener('change',e=>{ fileAsli=e.target.files[0]; if(!fileAsli) return; document.getElementById('infoUkuran').innerText=(fileAsli.size/1024).toFixed(0)+'KB'; let r=new FileReader(); r.onload=ev=>{ fotoBase64=ev.target.result; let p=document.getElementById('preview_img'); p.src=fotoBase64; p.style.display='inline-block'; if(fileAsli.size>800000) kompresFoto(); }; r.readAsDataURL(fileAsli); });
window.kompresFoto=()=>{ if(!fotoBase64) return; let img=new Image(); img.src=fotoBase64; img.onload=()=>{ let c=document.createElement('canvas'); let maxW=700; let s=Math.min(maxW/img.width,maxW/img.height,1); c.width=img.width*s; c.height=img.height*s; c.getContext('2d').drawImage(img,0,0,c.width,c.height); c.toBlob(b=>{ let r=new FileReader(); r.onload=ev=>{ fotoBase64=ev.target.result; document.getElementById('preview_img').src=fotoBase64; document.getElementById('infoUkuran').innerText=(b.size/1024).toFixed(0)+'KB ✅'; }; r.readAsDataURL(b); },'image/jpeg',0.65); } }

onSnapshot(colRef,snap=>{ allData=[]; snap.forEach(d=>allData.push({id:d.id,...d.data()})); render(); });
function render(){ let f=document.getElementById('cari').value.toLowerCase(); let data=allData.filter(c=>!f||(c.no_ktp||'').toLowerCase().includes(f)||(c.nama_customer||'').toLowerCase().includes(f)); document.getElementById('infoTotal').innerText=data.length+' Customer'; let tbody=document.getElementById('tbodyReguler'); tbody.innerHTML=''; if(!data.length){ tbody.innerHTML='<tr><td colspan=14>Belum ada Beb</td></tr>'; return; } data.forEach((c,i)=>{ let foto=c.foto?`<img src="${c.foto}" onclick="zoom('${c.foto}')">`:'-'; tbody.innerHTML+=`<tr><td>${i+1}</td><td>${foto}</td><td>${c.no_ktp||'-'}</td><td style="text-align:left">${c.nama_customer}</td><td>${c.no_hp}</td><td style="text-align:left">${c.email||'-'}</td><td style="text-align:left">${(c.alamat_sementara||'').substring(0,20)}</td><td>${c.nationality||'-'}</td><td>${c.no_sim||'-'}</td><td style="text-align:right">Rp ${parseInt(c.insurance||1400000).toLocaleString('id-ID')}</td><td>0 x</td><td style="text-align:right">Rp 0</td><td>${c.status_customer||'Aktif'}</td><td><button style="background:#ffc107;border:none;border-radius:3px;padding:3px 6px;font-size:10px;cursor:pointer" onclick="editReguler('${c.id}')">Edit</button><button style="background:#dc3545;color:white;border:none;border-radius:3px;padding:3px 6px;font-size:10px;cursor:pointer" onclick="hapusReguler('${c.id}')">Hapus</button></td></tr>`; }); }
document.getElementById('cari').addEventListener('input',render);
window.openModalTambah=()=>{ idEdit=null; fotoBase64=''; fotoLama=''; document.getElementById('formCustReguler').reset(); document.getElementById('reg_nationality').value='Indonesia'; document.getElementById('reg_insurance').value='1400000'; document.getElementById('preview_img').style.display='none'; document.getElementById('infoUkuran').innerText=''; document.getElementById('modalCustReguler').style.display='block'; }
window.closeModal=()=>document.getElementById('modalCustReguler').style.display='none';
window.editReguler=async id=>{ let snap=await getDoc(doc(db,"customers_reguler",id)); let c=snap.data(); idEdit=id; fotoLama=c.foto||''; fotoBase64=fotoLama; document.getElementById('reg_ktp').value=c.no_ktp||''; document.getElementById('reg_nama').value=c.nama_customer||''; document.getElementById('reg_nationality').value=c.nationality||''; document.getElementById('reg_sim').value=c.no_sim||''; document.getElementById('reg_insurance').value=c.insurance||'1400000'; document.getElementById('reg_hp').value=c.no_hp||''; document.getElementById('reg_email').value=c.email||''; document.getElementById('reg_ig').value=c.instagram||''; document.getElementById('reg_alamat_sementara').value=c.alamat_sementara||''; document.getElementById('reg_room').value=c.room_no||''; document.getElementById('reg_alamat_tetap').value=c.alamat_tetap||''; document.getElementById('reg_pekerjaan').value=c.pekerjaan||''; document.getElementById('reg_jk').value=c.jenis_kelamin||''; document.getElementById('reg_helm').value=c.no_helm||''; document.getElementById('reg_status').value=c.status_customer||'Aktif'; if(fotoLama){ let p=document.getElementById('preview_img'); p.src=fotoLama; p.style.display='inline-block'; } document.getElementById('modalCustReguler').style.display='block'; }
window.hapusReguler=async id=>{ if(confirm('Hapus Beb?')) await deleteDoc(doc(db,"customers_reguler",id)); }
document.getElementById('formCustReguler').addEventListener('submit',async e=>{ e.preventDefault(); if(fotoBase64&&fotoBase64.length>1100000){ alert('Foto kegedean Beb! Klik 🗜️ dulu!'); return; } let btn=document.getElementById('btnSimpan'); btn.disabled=true; btn.innerText='Menyimpan...'; let data={ no_ktp:document.getElementById('reg_ktp').value, nama_customer:document.getElementById('reg_nama').value, nationality:document.getElementById('reg_nationality').value, no_sim:document.getElementById('reg_sim').value, insurance:document.getElementById('reg_insurance').value, no_hp:document.getElementById('reg_hp').value, email:document.getElementById('reg_email').value, instagram:document.getElementById('reg_ig').value, alamat_sementara:document.getElementById('reg_alamat_sementara').value, room_no:document.getElementById('reg_room').value, alamat_tetap:document.getElementById('reg_alamat_tetap').value, pekerjaan:document.getElementById('reg_pekerjaan').value, jenis_kelamin:document.getElementById('reg_jk').value, no_helm:document.getElementById('reg_helm').value, status_customer:document.getElementById('reg_status').value, foto:fotoBase64||fotoLama||"", created_at:new Date().toISOString() }; try{ if(idEdit) await updateDoc(doc(db,"customers_reguler",idEdit),data); else await addDoc(colRef,data); closeModal(); e.target.reset(); }catch(err){ alert(err.message); } btn.disabled=false; btn.innerText='SIMPAN'; });
window.zoom=s=>{ document.getElementById('imgZoom').src=s; document.getElementById('modalZoom').style.display='block'; }
window.onclick=e=>{ if(e.target==document.getElementById('modalCustReguler')) closeModal(); if(e.target==document.getElementById('modalZoom')) document.getElementById('modalZoom').style.display='none'; }
</script>
</body>
</html>
