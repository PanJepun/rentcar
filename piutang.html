<!DOCTYPE html>
<html>
<head>
<title>DATA PIUTANG</title>
<style>
body { font-family: 'Segoe UI', Arial; background: #0a1629; margin: 0; padding: 15px; color: #333; }
h2 { text-align: center; color: #d4af37; font-size: 20px; margin: 5px 0 15px 0; font-weight: bold; }
.box { background: white; border: 2px solid #d4af37; border-radius: 8px; padding: 20px; max-width: 1300px; margin: auto; }
.tabel-piutang { width:100%; border-collapse:collapse; font-size:12px; }
.tabel-piutang th { background:#dc3545; color:#fff; padding:8px; text-align:center; }
.tabel-piutang td { border:1px solid #ddd; padding:6px; text-align:center; }
.tabel-piutang tr:nth-child(even){ background:#fff5f5; }
.badge-kredit { background:#ffc107; color:black; padding:3px 8px; border-radius:3px; font-size:11px; font-weight:bold; }
.badge-belum { background:#dc3545; color:white; padding:3px 8px; border-radius:3px; font-size:11px; font-weight:bold; }
.btn-bayar { background:#28a745; color:#fff; border:none; padding:5px 10px; border-radius:3px; cursor:pointer; font-size:11px; font-weight:bold; }
.btn-back { background:#6c757d; color:#fff; border:none; padding:10px 20px; border-radius:4px; cursor:pointer; font-weight:bold; margin-bottom:10px; }
.total-box { background: #dc3545; color: #fff; padding: 12px; border-radius: 4px; text-align: center; font-size: 16px; font-weight: bold; margin-bottom:15px; }
.modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); }
.modal-content { background: #fff; margin: 10% auto; padding: 20px; border-radius: 8px; width: 40%; border: 2px solid #d4af37; }
.form-bayar { display: grid; grid-template-columns: 120px 1fr; gap: 10px; align-items: center; }
.btn-simpan-bayar { background:#28a745; color:white; border:none; padding:10px 20px; border-radius:4px; cursor:pointer; font-weight:bold; grid-column:2/3; }
</style>
</head>
<body>

<h2>DATA PIUTANG CUSTOMER</h2>
<div class="box">
    <button class="btn-back" onclick="window.location='transaksi.html'">← Kembali ke Transaksi</button>
    <div class="total-box">TOTAL PIUTANG: Rp <span id="total_piutang">0</span></div>

    <div style="overflow-x:auto;">
        <table class="tabel-piutang">
            <thead>
                <tr>
                    <th>No</th><th>No Invoice</th><th>Customer</th><th>Mobil</th>
                    <th>Tgl Sewa</th><th>Total</th><th>Deposit</th><th>Sisa Piutang</th><th>Status</th><th>Aksi</th>
                </tr>
            </thead>
            <tbody id="tbodyPiutang"><tr><td colspan="10">Tidak ada data piutang</td></tr></tbody>
        </table>
    </div>
</div>

<!-- MODAL BAYAR -->
<div id="modalBayar" class="modal">
  <div class="modal-content">
    <h3>BAYAR PIUTANG</h3>
    <form id="formBayar" class="form-bayar">
        <label>No Invoice :</label><input type="text" id="bayar_invoice" readonly>
        <label>Nama :</label><input type="text" id="bayar_nama" readonly>
        <label>Sisa Piutang :</label><input type="text" id="bayar_sisa" readonly>
        <label>Bayar :</label><input type="number" id="bayar_nominal" placeholder="0" required>
        <label>Upload Bukti :</label><input type="file" id="bayar_bukti" accept="image/*">
        <div style="grid-column:2/3;"><button type="submit" class="btn-simpan-bayar">SIMPAN PEMBAYARAN</button></div>
    </form>
  </div>
</div>

<script>
let dataCustomer = JSON.parse(localStorage.getItem('dataCustomer')) || [];
let dataCustomerReguler = JSON.parse(localStorage.getItem('dataCustomerReguler')) || [];
let dataMobil = JSON.parse(localStorage.getItem('dataMobil')) || [];
let dataTransaksi = JSON.parse(localStorage.getItem('dataTransaksi')) || [];
let idBayar = null;

function loadTabelPiutang(){
    let tbody = document.getElementById('tbodyPiutang');
    let piutangData = dataTransaksi.filter(t => t.status_bayar == 'Belum Lunas' && t.tipe_customer == 'kredit');

    if(piutangData.length == 0){
        tbody.innerHTML = '<tr><td colspan="10">Tidak ada data piutang</td></tr>';
        total_piutang.innerText = '0';
        return;
    }

    tbody.innerHTML = '';
    let total = 0;

    piutangData.forEach((t, i) => {
        let cus = dataCustomer.find(c=>c.id==t.id_customer);
        let mob = dataMobil.find(m=>m.id==t.id_mobil);
        let sisa = parseInt(t.sisa_piutang) || (parseInt(t.total_bayar) - parseInt(t.deposit || 0));
        total += sisa;

        tbody.innerHTML += `<tr>
            <td>${i+1}</td>
            <td>${t.no_invoice}</td>
            <td>${cus?.nama_customer || '-'}</td>
            <td>${mob?.plat || '-'}</td>
            <td>${t.tgl_sewa}</td>
            <td>Rp ${parseInt(t.total_bayar).toLocaleString('id-ID')}</td>
            <td>Rp ${parseInt(t.deposit || 0).toLocaleString('id-ID')}</td>
            <td style="font-weight:bold; color:red;">Rp ${sisa.toLocaleString('id-ID')}</td>
            <td><span class="badge-belum">BELUM LUNAS</span></td>
            <td><button class="btn-bayar" onclick="bukaBayar(${t.id})">BAYAR</button></td>
        </tr>`;
    });
    total_piutang.innerText = total.toLocaleString('id-ID');
}

function bukaBayar(id){
    idBayar = id;
    let t = dataTransaksi.find(x=>x.id==id);
    let cus = dataCustomer.find(c=>c.id==t.id_customer);
    bayar_invoice.value = t.no_invoice;
    bayar_nama.value = cus?.nama_customer || '-';
    let sisa = parseInt(t.sisa_piutang) || (parseInt(t.total_bayar) - parseInt(t.deposit || 0));
    bayar_sisa.value = 'Rp ' + sisa.toLocaleString('id-ID');
    bayar_nominal.max = sisa;
    modalBayar.style.display = 'block';
}

document.getElementById('formBayar').addEventListener('submit', function(e){
    e.preventDefault();
    let t = dataTransaksi.find(x=>x.id==idBayar);
    let bayar = parseInt(bayar_nominal.value) || 0;
    let sisaLama = parseInt(t.sisa_piutang) || (parseInt(t.total_bayar) - parseInt(t.deposit || 0));
    let sisaBaru = sisaLama - bayar;

    t.deposit = parseInt(t.deposit || 0) + bayar;
    t.sisa_piutang = sisaBaru;
    if(sisaBaru <= 0){
        t.status_bayar = 'Lunas';
        sisaBaru = 0;
    }

    // simpan bukti bayar cicilan
    if(bayar_bukti.files[0]){
        let reader = new FileReader();
        reader.onload = function(evt){
            if(!t.riwayat_bayar) t.riwayat_bayar = [];
            t.riwayat_bayar.push({tanggal: new Date().toLocaleDateString('id-ID'), nominal: bayar, bukti: evt.target.result});
            simpan();
        }
        reader.readAsDataURL(bayar_bukti.files[0]);
    } else {
        if(!t.riwayat_bayar) t.riwayat_bayar = [];
        t.riwayat_bayar.push({tanggal: new Date().toLocaleDateString('id-ID'), nominal: bayar, bukti: ''});
        simpan();
    }

    function simpan(){
        localStorage.setItem('dataTransaksi', JSON.stringify(dataTransaksi));
        alert('✅ Pembayaran Rp ' + bayar.toLocaleString('id-ID') + ' berhasil disimpan!');
        modalBayar.style.display = 'none';
        document.getElementById('formBayar').reset();
        loadTabelPiutang();
    }
});

window.onclick = function(event) {
    if (event.target == modalBayar) {
        modalBayar.style.display = "none";
    }
}

loadTabelPiutang();
</script>
</body>
</html>
