<!DOCTYPE html>
<html>
<head><title>KOMPRES FOTO RENTAL2026</title>
<style>
body{font-family:Arial;background:#0a1629;color:white;text-align:center;padding:20px}
.box{background:#f7eb81;color:#000;padding:20px;border-radius:12px;max-width:500px;margin:auto;border:3px solid #d4af37}
input,button{padding:12px;width:100%;margin:8px 0;border-radius:8px;border:1px solid #aaa;font-weight:bold}
button{background:#007bff;color:white;cursor:pointer}
img{max-width:100%;border-radius:8px;margin-top:10px;border:2px solid #d4af37}
</style>
</head>
<body>
<h2 style="color:#d4af37">📸 KOMPRES FOTO - rental2026</h2>
<div class="box">
<input type="file" id="inputFoto" accept="image/*">
<label>Kualitas Beb (kecil = makin kecil file):</label>
<input type="range" id="kualitas" min="0.1" max="1" step="0.1" value="0.6"> <span id="labelK">60%</span>
<img id="preview">
<div id="info"></div>
<button id="btnDownload" style="display:none">⬇️ Download Hasil Kompres Beb!</button>
</div>
<script>
let hasilBlob=null;
document.getElementById('kualitas').oninput=e=>document.getElementById('labelK').innerText=Math.round(e.target.value*100)+'%';
document.getElementById('inputFoto').onchange=e=>{
 let file=e.target.files[0]; if(!file) return;
 let img=new Image(); img.src=URL.createObjectURL(file);
 img.onload=()=>{
  let canvas=document.createElement('canvas'); let maxW=1024;
  let scale=Math.min(maxW/img.width, maxW/img.height,1);
  canvas.width=img.width*scale; canvas.height=img.height*scale;
  canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
  canvas.toBlob(blob=>{
   hasilBlob=blob; let url=URL.createObjectURL(blob);
   document.getElementById('preview').src=url;
   document.getElementById('info').innerHTML=`Asli: ${(file.size/1024).toFixed(0)} KB Beb -> Jadi: ${(blob.size/1024).toFixed(0)} KB Beb<br>${blob.size<800000?'✅ UDAH LULUS BEB!':'❌ Masih kegedean Beb, kecilin kualitas Beb!'}`;
   let btn=document.getElementById('btnDownload'); btn.style.display='block';
   btn.onclick=()=>{let a=document.createElement('a'); a.href=url; a.download='mobil-kompres-'+Date.now()+'.jpg'; a.click();}
  },'image/jpeg', parseFloat(document.getElementById('kualitas').value));
 }
}
</script>
</body>
</html>
